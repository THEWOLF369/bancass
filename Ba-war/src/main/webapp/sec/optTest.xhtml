<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Test OPT</title>
</h:head>

<h:body>

<h:form id="formAvj">

    <p:commandButton value="Tester insertion OPT" id="validerPrposition"
                     action="#{userOtpTest.testOtp_0}"
                     update="result"/>
                     
                     
    <br/><br/>
    
     <p:commandButton
            value="Generate OTP"
            action="#{userOtpTest.testOtp}" />

    <br/><br/>

    <p:inputText
            value="#{userOtpTest.otpCode}" />

    <br/><br/>

    <p:commandButton
            value="Validate OTP"
            action="#{userOtpTest.validateOtp}" />

    <h:outputText id="result"
                  value="fffff" style="font-weight:bold;color:blue"/>
                  
                  
                  
             <p:blockUI block="formAvj" trigger="validerPrposition">
						        Chargement...<br />
						        <p:graphicImage value="../img/loaders/page_loader.gif"/>
					    	</p:blockUI>

</h:form>

</h:body>
</html>
