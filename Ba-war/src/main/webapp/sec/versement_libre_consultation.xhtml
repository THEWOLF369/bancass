        <ul class="breadcrumb br_styled no_space">
            <li class="active">Consultation des Versements Libres</li>
        </ul>
        <ul class="page_info">
        
        
        
                <p:messages  autoUpdate="true" showDetail="true" closable="true"/>
         <p:growl id="message" showDetail="true"/>
        
        
        
<h:form id="form">

    <!-- ===================== FILTRES ===================== -->
    <div style="display:flex; flex-wrap:wrap; gap:20px; margin-bottom:15px;">

        <!-- Produit -->
			<p:outputPanel layout="block"
               rendered="#{!login.utilisateur.profil.code.equals('IST') and
    !login.utilisateur.profil.code.equals('TDST') and !login.utilisateur.profil.code.equals('VST') and 
    !login.utilisateur.profil.code.equals('AST') and !login.utilisateur.profil.code.equals('VTST')}"
               style="display:flex; align-items:center; gap:8px;">
            
            <h:outputLabel value="Produit :" styleClass="small-font"/>
            
            <h:selectOneMenu class="etat-select"
                             value="#{versementLibreConsultationBean.libelleProduit}">
                <f:selectItem itemLabel="Choisir..." />
                <f:selectItems value="#{versementLibreConsultationBean.produits}"
                               var="p"
                               itemLabel="#{p.libelleProduit}"
                               itemValue="#{p.libelleProduit}"/>
            </h:selectOneMenu>
        </p:outputPanel>

        <!-- Contrat -->
        <div style="display:flex; align-items:center; gap:8px;">
            <h:outputLabel value="Contrat N° :" styleClass="small-font"/>
            <p:inputText value="#{versementLibreConsultationBean.nadhesion}" />
        </div>

        <!-- Identifiant -->
        <div style="display:flex; align-items:center; gap:8px;">
            <h:outputLabel value="Identifiant Client :" styleClass="small-font"/>
            <p:inputText value="#{versementLibreConsultationBean.cin}" />
        </div>
        

        <!-- Identifiant -->
        <div style="display:flex; align-items:center; gap:8px;">
            <h:outputLabel value="Quittance N° :" styleClass="small-font"/>
            <p:inputText value="#{versementLibreConsultationBean.numquit}" />
        </div>        

        <!-- Société -->
        <p:outputPanel layout="block" 
                rendered="#{login.utilisateur.profil.code.equals('IST') || login.utilisateur.profil.code.equals('AST') || 
    login.utilisateur.profil.code.equals('TDST')  ||  login.utilisateur.profil.code.equals('VST')  ||  
    login.utilisateur.profil.code.equals('ASI')  ||  login.utilisateur.profil.code.equals('VTST')}"
               style="display:flex; align-items:center; gap:8px;">

            <h:outputLabel value="Société :" styleClass="small-font"/>

            <p:selectOneMenu value="#{versementLibreConsultationBean.codeSociete}"
                             filter="true"
                             filterMatchMode="contains"
                             style="width:150px">
                <f:selectItems value="#{versementLibreConsultationBean.listSociete}" />
            </p:selectOneMenu>
        </p:outputPanel>

        <!-- Code Agence -->
        <p:outputPanel layout="block"
               rendered="#{login.utilisateur.profil.code.equals('AST') || login.utilisateur.profil.code.equals('AS')}"
               style="display:flex; align-items:center; gap:8px;">

            <h:outputLabel value="Code agence :" styleClass="small-font"/>
            <p:inputText />
        </p:outputPanel>

    </div>


    <!-- ===================== DATES ===================== -->
    <div style="margin-bottom:15px;">

        <!-- Date Création -->
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:6px;">
            
            <span style="font-weight:bold; width:170px;">
                Date création contrat :
            </span>

            <span>Du</span>
<p:calendar id="startDate"
            value="#{versementLibreConsultationBean.from}"
            pattern="dd/MM/yyyy"
            showOn="button"
            popupIconOnly="false"
            locale="en"
            required="false"
            style="width:200px;" 
            label="#{ui['calendar.start']}">
    <p:ajax event="dateSelect" update="endDate"/>
</p:calendar>


            <span>Au</span>
<p:calendar id="endDate"
            value="#{versementLibreConsultationBean.to}"
            mindate="#{versementLibreConsultationBean.from}"
            pattern="dd/MM/yyyy"
            showOn="button"
            popupIconOnly="false"
            locale="en"
            required="false"
            label="#{ui['calendar.end']}"
            style="width:200px;">
</p:calendar>

        </div>

        <!-- Date Versement -->
        <div style="display:flex; align-items:center; gap:12px;">
            
            <span style="font-weight:bold; width:170px;">
                Date versement :
            </span>

            <span>Du</span>
<p:calendar id="startDateV"
            value="#{versementLibreConsultationBean.fromV}"
            pattern="dd/MM/yyyy"
            showOn="button"
            popupIconOnly="false"
            locale="en"
            required="false"
            style="width:200px;" 
            label="#{ui['calendar.start']}">
    <p:ajax event="dateSelect" update="endDateV"/>
</p:calendar>


            <span>Au</span>
<p:calendar id="endDateV"
            value="#{versementLibreConsultationBean.toV}"
            mindate="#{versementLibreConsultationBean.fromV}"
            pattern="dd/MM/yyyy"
            showOn="button"
            popupIconOnly="false"
            locale="en"
            required="false"
            label="#{ui['calendar.end']}"
            style="width:200px;">
</p:calendar>
        </div>

    </div>


    <!-- ===================== BOUTON ===================== -->
    <div style="text-align:center; margin-top:15px;">
          <p:commandLink  action="#{versementLibreConsultationBean.Chercher}" update="form" ajax="true" id="searchBtn" >
                     <img src="${facesContext.externalContext.requestContextPath}/images/research.png" width="32" height="32"/>
                    </p:commandLink>
    </div>
    
    
                    <h:commandLink   >
                     <img src="${facesContext.externalContext.requestContextPath}/images/icon/excel.png" width="32" height="32"/>
                      <p:dataExporter type="xls" target="dataTable" fileName="Versement-libre" />
                    </h:commandLink>
 				<h:commandLink   >
                     <img src="${facesContext.externalContext.requestContextPath}/images/icon/pdf.png" width="32" height="32"/>
                      <p:dataExporter type="pdf" target="dataTable" fileName="Versement-libre" />
                    </h:commandLink>
				 <h:commandLink   >
                     <img src="${facesContext.externalContext.requestContextPath}/images/icon/csv.png" width="32" height="32"/>
                      <p:dataExporter type="csv" target="dataTable" fileName="Versement-libre" />
                    </h:commandLink>
 
  				<h:commandLink   >
  	                   <img src="${facesContext.externalContext.requestContextPath}/images/icon/xml.png" width="32" height="32"/>
                      <p:dataExporter type="xml" target="dataTable" fileName="Versement-libre" />
                    </h:commandLink>
                    
                    
                    
 <p:growl id="growl"/>
                    
                <p:dataTable var="consultation" reflow="true" id="dataTable" widgetVar="customersTable"
                             rowStyleClass="#{(rowIndex mod 2) eq 0 ? 'row1' : 'row2'}"
                             styleClass="table" rowIndexVar="rowIndex"
                             value="#{versementLibreConsultationBean.qtcVlList}" paginator="true" rows="10"
                             rowsPerPageTemplate="10,20,30,40,50"
                             scrollable="true" scrollWidth="800" 
                              paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} "
                  rowExpandMode="single" >
                  
                      <p:column headerText="N° contrat" style="width:100px;"
                        >
                            <h:outputText value="#{consultation.adhesion.nadhesion}"/>
                        </p:column>                 
                  
                  
                     <p:column headerText="N° quittance" style="width:100px;"
                        >
                            <h:outputText value="#{consultation.quittance.numquit}"/>
                        </p:column>
                        <p:column headerText="Agence" style="width:80px;">
                            <h:outputText value="#{consultation.detail.agence.codeAgence}"/>
                        </p:column>
                        
<!--                         <p:column headerText="Date de versement" style="width:100px;"> -->
<!--                             <h:outputText value="#{consultation.quittance.DATE_CREATION}"/> -->
<!--                         </p:column> -->
                        
  						<p:column headerText="Date d'opération" style="width:100px;">
                            <h:outputText value="#{consultation.detail.dateEnc}"/>
                        </p:column>                        
                        
                        <p:column headerText="Prime nette" style="width:100px;">
                            <p:outputLabel value="#{consultation.detail.primenette}" >
                            <f:convertNumber pattern="#0.000" /> </p:outputLabel>                          
                        </p:column>
                        <p:column headerText="Frais" style="width:100px;">
                            <p:outputLabel value="#{consultation.quittance.frais}">
                            <f:convertNumber pattern="#0.000" /> </p:outputLabel>      
                        </p:column>
                        <p:column headerText="Taxes" style="width:100px;">
                            <p:outputLabel value="#{consultation.quittance.taxe}">
                            <f:convertNumber pattern="#0.000" /> </p:outputLabel>      
                        </p:column>
                        <p:column headerText="FGA" style="width:100px;">
                            <p:outputLabel value="#{consultation.quittance.fga}">
                            <f:convertNumber pattern="#0.000" /> </p:outputLabel>      
                        </p:column>
                        <p:column headerText="Prime totale" style="width:100px;">
                            <p:outputLabel value="#{consultation.detail.primetot}">
                            <f:convertNumber pattern="#0.000" /> </p:outputLabel>      
                        </p:column>
                        
                             <p:column headerText="QTC" style="width:40px;text-align: center"
                       filterStyle="display: none" >

                        <p:commandLink title="QTC" ajax="false"  
                                       action="#{versementLibreConsultationBean.printQTC(consultation)}" target="_blank">
                            <i class="fa fa-fw fa-print"></i>
                        </p:commandLink>
                    </p:column>
                  
                  
                  
                  </p:dataTable>   
                  
                  
                  
                  
                   <p:blockUI block="dataTable" trigger="dataTable">
        Chargement...<br />
        <p:graphicImage value="../img/loaders/page_loader.gif"/>
    </p:blockUI>



  
    
    <p:blockUI block="dataTable" trigger="searchBtn" >
    Chargement...<br />
        <p:graphicImage value="../img/loaders/page_loader.gif"/>
    </p:blockUI>                 
    

</h:form>

        
        
        </ul>
        
        
       <script>
            function filterTable(input, className) {
                console.log(input);
                filterInput = $("." + className);
                filterInput.val(input.value);
                filterInput.trigger("keyup");
            }

            function filterTableDate(className) {
                dateValue = PF('filterDate').input.val();
                filterInput = $("." + className);
                filterInput.val(dateValue);
                filterInput.trigger("keyup");
            }

            function filtrerGlobal() {
                filterEtat('etatFilter', document.getElementById('form:idSelectionEtat'));
                
            }
           
            
            function filterEtat(className, etat) {
                filterInput = $("." + className);
                etat = etat.options[etat.selectedIndex].value;
                if (etat === 'a') {
                    etat = "";
                }
                filterInput.val(etat);
                filterInput.trigger("keyup");
            }
        </script>
