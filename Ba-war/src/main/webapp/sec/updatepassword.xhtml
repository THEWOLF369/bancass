<ui:composition template="/sec/template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="body">
	
	<script>
	
	function myFunction() {
		  var x = document.getElementById("password");
		  if (x.type === "password") {
		    x.type = "text";
		  } else {
		    x.type = "password";
		  }
		}
	
</script>
	
		<style type="text/css">
.labelWidth {
	width: 150px;
}

.ui-inputfield,.ui-widget-content .ui-inputfield,.ui-widget-header .ui-inputfield
	{
	background: 0 !important;
	background-color: white !important;
	box-shadow: none !important;
}

label {
	color: black;
}

.orangeButton {
	background: 0 !important;
	color: #fff !important;
	text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.25) !important;
	background-color: #faa732 !important;
	background-image: -moz-linear-gradient(top, #fbb450, #f89406) !important;
	background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#fbb450),
		to(#f89406)) !important;
	background-image: -webkit-linear-gradient(top, #fbb450, #f89406)
		!important;
	background-image: -o-linear-gradient(top, #fbb450, #f89406) !important;
	background-image: linear-gradient(to bottom, #fbb450, #f89406)
		!important;
	background-repeat: repeat-x !important;
	border-color: #f89406 #f89406 #ad6704 !important;
	border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25)
		!important;
}

.redButton {
	color: #fff !important;
	text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.25) !important;
	background-color: #da4f49 !important;
	background-image: -moz-linear-gradient(top, #ee5f5b, #bd362f) !important;
	background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#ee5f5b),
		to(#bd362f)) !important;
	background-image: -webkit-linear-gradient(top, #ee5f5b, #bd362f)
		!important;
	background-image: -o-linear-gradient(top, #ee5f5b, #bd362f) !important;
	background-image: linear-gradient(to bottom, #ee5f5b, #bd362f)
		!important;
	background-repeat: repeat-x !important;
	border-color: #bd362f #bd362f #802420 !important;
	border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25)
		!important;
}

.greenButton {
	color: #fff !important;
	text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.25) !important;
	background-color: #5bb75b !important;
	background-image: -moz-linear-gradient(top, #62c462, #51a351) !important;
	background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#62c462),
		to(#51a351)) !important;
	background-image: -webkit-linear-gradient(top, #62c462, #51a351)
		!important;
	background-image: -o-linear-gradient(top, #62c462, #51a351) !important;
	background-image: linear-gradient(to bottom, #62c462, #51a351)
		!important;
	background-repeat: repeat-x !important;
	border-color: #51a351 #51a351 #387038 !important;
	border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25)
		!important;
}

textarea:focus,input[type="text"]:focus,input[type="password"]:focus,input[type="datetime"]:focus,input[type="datetime-local"]:focus,input[type="date"]:focus,input[type="month"]:focus,input[type="time"]:focus,input[type="week"]:focus,input[type="number"]:focus,input[type="email"]:focus,input[type="url"]:focus,input[type="search"]:focus,input[type="tel"]:focus,input[type="color"]:focus,.uneditable-input:focus
	{
	border: 1px solid #d5d5d5 !important;
}

.ui-autocomplete {
	background: 0 !important;
	border: 0 !important;
}

.ui-autocomplete .ui-autocomplete-dropdown {
	height: 29px;
}
</style>

		<ul class="breadcrumb br_styled no_space">
			<li class="active">Changer mot de passe</li>
		</ul>
		<ul class="page_info">
		 
			
			<h:form id="changePwdForm">
			
   <p:growl id="growl"
                     autoUpdate="true"
                     showDetail="true"
                     life="8000" />

            <!-- Message première connexion -->
            <p:panel rendered="#{login.firstLogin}"
                     style="margin-bottom:15px;
                            border:1px solid #f0ad4e;
                            background:#fcf8e3;
                            padding:10px;">

 
                    
               <h:outputText
    value="#{gestionProfil.modeSTB
        ? 'Première connexion détectée. Vous devez modifier votre mot de passe et vérifier votre matricule et adresse e-mail avant de continuer.'
        : 'Première connexion détectée. Vous devez modifier votre mot de passe et vérifier votre login et adresse e-mail avant de continuer.'}"
    style="color:#8a6d3b;font-weight:bold;" />     

            </p:panel>			
			
			<center>
                        <h:panelGrid columns="2" >
                              <p:outputLabel value="Nom :"/>
                            <p:outputLabel value="#{login.utilisateur.nom}" />
                            <p:outputLabel value="Prénom :"/>
                            <p:outputLabel value="#{login.utilisateur.prenom}" />
                            
                            
                            
                             <p:outputLabel value="#{gestionProfil.modeSTB ? 'Matricule :' : 'Login :'}" for="login"/>
                             
                            <p:outputLabel rendered="#{!login.firstLogin}" value="#{login.utilisateur.login}" />
                            
 							 <p:inputText id="login"
							             value="#{login.utilisateur.login}"
							             rendered="#{login.firstLogin}"
							             required="#{login.firstLogin}"
							             readonly="true"
							             label="#{gestionProfil.modeSTB ? 'Matricule' : 'Login'}"

								    validatorMessage="#{gestionProfil.modeSTB
								        ? 'Veuillez saisir un matricule valide (ex: 1234A)'
								        : 'Veuillez saisir un login valide'}"
								
								    requiredMessage="#{gestionProfil.modeSTB
								        ? 'Le matricule est obligatoire'
								        : 'Le login est obligatoire'}">

							</p:inputText>                              
                            
                            
                            <p:outputLabel value="E-mail :" for="mail"/>
                            
                            <p:outputLabel rendered="#{!login.firstLogin}" value="#{login.utilisateur.mail}" />

							<p:inputText id="mail"
							             value="#{login.utilisateur.mail}"
							             rendered="#{login.firstLogin}"
							             required="#{login.firstLogin}"
							             readonly="true"
							             validatorMessage="Veuillez saisir une adresse e-mail valide (ex: user@gmail.com)"
							             requiredMessage="L'adresse e-mail est obligatoire">
						    <f:validateRegex
    pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$"/>

							</p:inputText>
							
				 
                            
                            
                        
                            
                            <p:outputLabel value="Mot de passe actuel :"   for="pwd" />
 

                             <p:password  id="pwd" value="#{userBean.currentPassword}"  
                             required="true" requiredMessage="Veuillez saisir votre mot de passe actuel"
                             feedback="false"/>
                             
                             
                             <p:outputLabel value="Nouveau mot de passe :" for="nouveauPassword" />                                                          
                             <p:password  id="nouveauPassword" value="#{login.utilisateur.newPassword}" match="pwd2" 
                             required="true" requiredMessage="Veuillez saisir un nouveau mot de passe."
                             validatorMessage="Les 2 nouveaux mots de passe doivent être identiques"/>
                             
                             
                              <p:outputLabel value="Retaper le nouveau mot de passe :" for="pwd2" />                                                          
                             <p:password  id="pwd2" value="#{login.reNewPassword}" required="true" 
                             requiredMessage="Veuillez confirmer le nouveau mot de passe."/>
                           
                           

          
          
     
                           
                            
                            
                        </h:panelGrid>
                        
                        

                        
                        
                        
                        <p:commandButton update="@form" value="Enregistrer"
								styleClass="greenButton" action="#{userBean.updatePasswordUserConnected()}" ></p:commandButton>
								</center>
                         
                         
                         
	<p:messages id="messages" showDetail="false" escape="false">
				            
				        </p:messages>
                         
                         
                         </h:form>
                      
                       
					
		</ul>
	</ui:define>
</ui:composition>
