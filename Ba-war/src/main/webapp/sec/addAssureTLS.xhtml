<ui:composition template="/sec/template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="body">


		<style type="text/css">
.labelWidth {
	width: 150px;
}

.ui-inputfield,.ui-widget-content .ui-inputfield,.ui-widget-header .ui-inputfield
	{
	background: 0 !important;
	background-color: white !important;
	box-shadow: none !important;
}

label {
	color: black;
}

.orangeButton {
	background: 0 !important;
	color: #fff !important;
	text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.25) !important;
	background-color: #faa732 !important;
	background-image: -moz-linear-gradient(top, #fbb450, #f89406) !important;
	background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#fbb450),
		to(#f89406)) !important;
	background-image: -webkit-linear-gradient(top, #fbb450, #f89406)
		!important;
	background-image: -o-linear-gradient(top, #fbb450, #f89406) !important;
	background-image: linear-gradient(to bottom, #fbb450, #f89406)
		!important;
	background-repeat: repeat-x !important;
	border-color: #f89406 #f89406 #ad6704 !important;
	border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25)
		!important;
}

.redButton {
	color: #fff !important;
	text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.25) !important;
	background-color: #da4f49 !important;
	background-image: -moz-linear-gradient(top, #ee5f5b, #bd362f) !important;
	background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#ee5f5b),
		to(#bd362f)) !important;
	background-image: -webkit-linear-gradient(top, #ee5f5b, #bd362f)
		!important;
	background-image: -o-linear-gradient(top, #ee5f5b, #bd362f) !important;
	background-image: linear-gradient(to bottom, #ee5f5b, #bd362f)
		!important;
	background-repeat: repeat-x !important;
	border-color: #bd362f #bd362f #802420 !important;
	border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25)
		!important;
}

.greenButton {
	color: #fff !important;
	text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.25) !important;
	background-color: #5bb75b !important;
	background-image: -moz-linear-gradient(top, #62c462, #51a351) !important;
	background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#62c462),
		to(#51a351)) !important;
	background-image: -webkit-linear-gradient(top, #62c462, #51a351)
		!important;
	background-image: -o-linear-gradient(top, #62c462, #51a351) !important;
	background-image: linear-gradient(to bottom, #62c462, #51a351)
		!important;
	background-repeat: repeat-x !important;
	border-color: #51a351 #51a351 #387038 !important;
	border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25)
		!important;
}

textarea:focus,input[type="text"]:focus,input[type="password"]:focus,input[type="datetime"]:focus,input[type="datetime-local"]:focus,input[type="date"]:focus,input[type="month"]:focus,input[type="time"]:focus,input[type="week"]:focus,input[type="number"]:focus,input[type="email"]:focus,input[type="url"]:focus,input[type="search"]:focus,input[type="tel"]:focus,input[type="color"]:focus,.uneditable-input:focus
	{
	border: 1px solid #d5d5d5 !important;
}

.ui-autocomplete {
	background: 0 !important;
	border: 0 !important;
}

.ui-autocomplete .ui-autocomplete-dropdown {
	height: 29px;
}
</style>
		<h:body style=" border: none;"
			rendered="#{!gestionProfil.souscriptionAssistanceTls}">
			<ul class="breadcrumb br_styled no_space">
				<li class="active">Accès non autorisé</li>
			</ul>
			<ul class="page_info">
				<center>
					<img src="../images/autorisation.jpg" height="15%" width="15%" />
				</center>
			</ul>
		</h:body>
		<h:body style=" border: none;"
			rendered="#{gestionProfil.souscriptionAssistanceTls}">
			<ul class="breadcrumb br_styled no_space">
				<li class="active">Liste des adhérents</li>
			</ul>
			<ul class="page_info">
				<p:growl autoUpdate="true" />
				<h:panelGroup id="Client">
					<h:form id="detailsAdherentForm">
						<h:panelGrid columns="2">
							<p:outputLabel value="Nombre des assurés à ajouter : "
								for="nombreAssuré" />
							<p:outputLabel id="nombreAssuré"
								value="#{assistanceVoiyageController.nombreAssureAajouter}" />

						</h:panelGrid>

						<p:growl id="growl" showDetail="true" sticky="true" />
						<p:messages />
						<h:panelGrid columns="4" columnClasses="labelWidth, ui-grid-col-3" id="grid">

							

                           <p:outputLabel value="Type de document:" for="docType" />
							<p:selectOneMenu
								value="#{assistanceVoiyageController.newAdherent.typeDoc}"
								id="docType">
								<f:selectItem itemValue="CIN" itemLabel="CIN" />
								<f:selectItem itemValue="Passport" itemLabel="Passport" />
								<f:selectItem itemValue="CarteSejour" itemLabel="Carte Séjour" />
							</p:selectOneMenu>

							<p:outputLabel value="Identifiant:" for="identifiant" />
							<p:inputText id="identifiant"
								value="#{assistanceVoiyageController.newAdherent.identifiant}" />
							
							<p:outputLabel value="Nom:" for="txtNom" />
							<p:inputText id="txtNom" styleClass="form-control"
								value="#{assistanceVoiyageController.newAdherent.nomAdherent}"
								required="true" requiredMessage="Le nom est obligatoire" />

							<p:outputLabel value="Prenom:" for="txtPrenom" />
							<p:inputText id="txtPrenom" styleClass="form-control"
								value="#{assistanceVoiyageController.newAdherent.prenomAdherent}"
								required="true" requiredMessage="Le prenom est obligatoire" />

							<p:outputLabel value="Date de naissance" for="txtBirthday" />
							<p:calendar id="txtBirthday" styleClass="combo-style"
								maxdate="#{assistanceVoiyageController.minage}"
								showButtonPanel="true" pattern="dd/MM/yyyy"
								value="#{assistanceVoiyageController.newAdherent.datNaiss}"
								required="true"
								requiredMessage="La date de naissance est obligatoire" />
							
							<p:outputLabel value="Sexe:" for="sexAssur" />
							<h:selectOneMenu id="sexAssur" styleClass="form-control"
								value="#{assistanceVoiyageController.newAdherent.sexe}">
								<f:selectItem itemLabel="F" itemValue="Feminin" />
								<f:selectItem itemLabel="M" itemValue="Masculin" />
							</h:selectOneMenu>

							<p:outputLabel value="N° Adresse" for="txtAdrNum" />
							<p:inputNumber id="txtAdrNum" styleClass="form-control"
								value="#{assistanceVoiyageController.newAdherent.numAdr}"
								required="false" thousandSeparator="" decimalPlaces="0" />


							<p:outputLabel value="Type de voie:" for="txtVoie" />
							<p:selectOneMenu styleClass="form-control"
								value="#{assistanceVoiyageController.newAdherent.typeVoie}"
								id="txtVoie">
								<f:selectItem itemLabel="Selectionnez voie..." value="#{null}" />
								<f:selectItems value="#{assistanceVoiyageController.typeVoies}"
									var="typeVoie" />
							</p:selectOneMenu>


							<p:outputLabel value="Adresse:" for="adresseAssur" />
							<p:inputText id="adresseAssur"
								value="#{assistanceVoiyageController.newAdherent.adresse}" />


							<p:outputLabel value="Gouvernorat:" for="gouvernerat" />
							<p:selectOneMenu id="gouvernerat" styleClass="form-control"
								value="#{assistanceVoiyageController.newAdherent.gouver}"
								filter="true" filterMatchMode="contains" style="width:60px">

								<p:ajax event="itemSelect" process="@this"
									listener="#{assistanceVoiyageController.updateListCodePostalActionListener()}"
									update="txtZipCode" />
								<f:selectItem itemLabel="Selectionnez gouvernorat..."
									value="#{null}" />
								<f:selectItems
									value="#{assistanceVoiyageController.allGouverneras}" />

							</p:selectOneMenu>


							<p:outputLabel value="Code postale:" for="txtZipCode" />
							<p:selectOneMenu id="txtZipCode" styleClass="form-control"
								value="#{assistanceVoiyageController.selectedLocgouv.code}"
								filter="true" filterMatchMode="contains" style="width:60px">

								<p:ajax event="itemSelect" process="@this"
									listener="#{assistanceVoiyageController.locgouvSelectListened}"
									update="txtLocalite" />
								<f:selectItem itemLabel="Selectionnez code postal..."
									value="#{null}" />
								<f:selectItems
									value="#{assistanceVoiyageController.allCodePostalByGouvernera}"
									var="ojectCodePostal"
									itemLabel="#{ojectCodePostal.codePosta} #{ojectCodePostal.localite}" 
									itemValue="#{ojectCodePostal.code}"/>

							</p:selectOneMenu>



							<p:outputLabel value="Localite:" for="txtLocalite" />
							<h:inputText id="txtLocalite" styleClass="form-control"
								value="#{assistanceVoiyageController.newAdherent.localite}"
								disabled="true" requiredMessage="La localité est obligatoire" />


							<p:outputLabel value="Téléphone:" for="telAssur" />
							<p:inputText id="telAssur"
								value="#{assistanceVoiyageController.newAdherent.tel}" />
							<p:outputLabel value="Profession:" />

							<p:selectOneMenu styleClass="form-control"
								converter="#{assistanceVoiyageController.professionConverter}"
								value="#{assistanceVoiyageController.newAdherent.profession}"
								id="txtprofession">
								<f:selectItem itemLabel="Selectionnez Profession..."
									value="#{null}" />
								<f:selectItems
									value="#{assistanceVoiyageController.allProfessions}"
									var="profession" itemLabel="#{profession.libelleProfession}"
									itemValue="#{profession.idProfession.toString()}" />
							</p:selectOneMenu>


<p:outputLabel value="" />

							<p:commandButton ajax="true" value="Ajouter"
								action="#{assistanceVoiyageController.addNewAdherentTolist_TLS()}"
								update="detailsAdherentForm listAdherentForm"
								styleClass="greenButton"></p:commandButton>
								
							<p:commandButton value="Réinitialiser" 
								process="@this" styleClass="redButton"
								update="grid"
								actionListener="#{assistanceVoiyageController.reinitialiserAdherent()}" />
							<p:outputLabel value="" />
						</h:panelGrid>







					</h:form>








					<h:form id="listAdherentForm">
						<p:dataTable var="adherents" reflow="true"
							rowStyleClass="#{(rowIndex mod 2) eq 0 ? 'row1' : 'row2'}"
							styleClass="table"
							value="#{assistanceVoiyageController.newAdhesion.adherents}">





							<p:column style="width:30px">
								<p:rowToggler />
							</p:column>




							<p:column headerText="Nom" filterStyleClass="dateDebutFilter"
								filterBy="#{adherents.nomAdherent}" filterStyle="display: none">
								<h:outputLabel value="#{adherents.nomAdherent}" />
							</p:column>

							<p:column headerText="Prénom">
								<h:outputLabel value="#{adherents.prenomAdherent}" />
							</p:column>

							<p:column headerText="Date de naissance">
								<h:outputLabel value="#{adherents.datNaiss}">

									<f:convertDateTime pattern="dd/MM/yyyy" />
								</h:outputLabel>
							</p:column>

							<p:column headerText="supprimé" style="width: 10%">
								<p:commandLink
									action="#{assistanceVoiyageController.deleteAderentFromList()}"
									ajax="true" update="listAdherentForm detailsAdherentForm">
									<f:setPropertyActionListener value="#{adherents}"
										target="#{assistanceVoiyageController.selectedAdherentToUpdate}" />
									<img
										src="${facesContext.externalContext.requestContextPath}/images/delete_bleu.png"
										width="17" height="17" />
								</p:commandLink>
							</p:column>

						</p:dataTable>



						<h:commandLink action="devis_AssistvoyageTLS?faces-redirect=true"
							value="Retour">
							<img
								src="${facesContext.externalContext.requestContextPath}/images/back.png"
								width="25" height="25" />
						</h:commandLink>



					</h:form>

				</h:panelGroup>
			</ul>
		</h:body>
	</ui:define>
</ui:composition>
