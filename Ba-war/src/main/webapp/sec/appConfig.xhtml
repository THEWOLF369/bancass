<ui:composition template="/sec/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core">

    <ui:define name="body">
        
     <h:body style=" border: none;" rendered="#{!gestionProfil.ajoutUser}" >
    <ul class="breadcrumb br_styled no_space">
            <li class="active">Accès non autorisé</li>
        </ul>
        <ul class="page_info">
         <center>
         <img src="../images/autorisation.jpg"  height="15%" width="15%"/>
         </center>
    </ul>
    </h:body>
 <h:body style=" border: none;"  > 
        <ul class="breadcrumb br_styled no_space">
            <li class="active">config</li>
        </ul>
        <ul class="page_info">

<h:form id="form">

    <p:growl id="msg" showDetail="true" />
    
    
    <p:commandButton value="Rafraîchir"
                 actionListener="#{appConfigController.reload}"
                 update="form msg"
                 icon="pi pi-refresh"/>
                 
 <p:commandButton value="Refresh Cache Global"
                 actionListener="#{appConfigController.forceRefreshCache}"
                 update="msg"
                 icon="pi pi-refresh"
                 styleClass="ui-button-success"/>                
                 

    <p:dataTable value="#{appConfigController.configs}" var="conf">

        <p:column headerText="Code">
            <h:outputText value="#{conf.code}" />
        </p:column>

        <p:column headerText="Valeur">

            <!-- BOOLEAN -->
            <h:panelGroup rendered="#{conf.type eq 'BOOLEAN'}">

                <p:selectOneMenu value="#{conf.value}">
                    <f:selectItem itemLabel="TRUE" itemValue="TRUE"/>
                    <f:selectItem itemLabel="FALSE" itemValue="FALSE"/>

                    <p:ajax listener="#{appConfigController.onEdit(conf)}"
                            update=":form:msg"/>
                </p:selectOneMenu>

            </h:panelGroup>

            <!-- STRING -->
            <h:panelGroup rendered="#{conf.type eq 'STRING'}">

                <p:inputText value="#{conf.value}">
                    <p:ajax event="blur"
                            listener="#{appConfigController.onEdit(conf)}"
                            update=":form:msg"/>
                </p:inputText>

            </h:panelGroup>

        </p:column>

    </p:dataTable>

</h:form>

</ul>
</h:body>

 </ui:define>

    <ui:define name="jquery"></ui:define>
    <ui:define name="jqueryui"></ui:define>
</ui:composition>
