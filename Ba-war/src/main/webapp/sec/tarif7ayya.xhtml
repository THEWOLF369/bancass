<ui:composition
    template="/sec/template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:c="http://java.sun.com/jsp/jstl/core">
    
    


    <ui:define name="body">
    
 <style type="text/css">
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

tr:nth-child(even) {
/*   background-color: #dddddd; */
}

.mtd{

background-color: #dddddd;
}

.ui-state-default, .ui-widget-content .ui-state-default, .ui-widget-header .ui-state-default {

    width: 200px;
}



</style>
    
    
<h:body style=" border: none;" rendered="#{!gestionProfil.souscription7ayya}" >
    <ul class="breadcrumb br_styled no_space">
            <li class="active">Accès non autorisé</li>
        </ul>
        <ul class="page_info">
         <center>
         <img src="../images/autorisation.jpg"  height="15%" width="15%"/>
         </center>
    </ul>
    </h:body>
    <h:body style=" border: none;" rendered="#{gestionProfil.souscription7ayya}">
        <div class="span12 no_space">

            <div class="widget">
                <header>
                    <h3 class="active">Tarif</h3>
                    <ul class="toggle_content">                         
                        <li class="arrow"><a href="#">Toggle Content</a></li>
                    </ul>
                </header>
                <section class="welly"> 

                    <ul class="nav nav-tabs tab_styled_light">
                       
                      
                    </ul>

                    <div class="tab-content tab_content_light">
                        <div  id="Tarif" class="tab-pane fade in active">
                            <h:form id="form">
                            <div>  
                          
								<p:tabView  dynamic="true" cache="true" effect="fold">
								        <p:tab title="Résultat">
								        
								        <br> </br>
								        
								        <br> </br>
								        
                                <div>  
                                    <h:panelGrid columns="2" cellpadding="5">
                                        
                                         <p:outputLabel  value="Prime comptant: " for="primecomptant" styleClass="label label-danger price"/>
                                        <h:outputText id="primecomptant" styleClass="label label-important price"  value="#{tarif7ayyaBean.primeComptant}"  >
                                           <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>	
                                        </h:outputText>  
                                        
                                        
                                        <p:outputLabel  value="Date echeance: " for="dateEcheance" styleClass="label label-danger price"/>
                                        <h:outputText id="dateEcheance" styleClass="label label-info price"  value="#{tarif7ayyaBean.echDate}"  >
                                           
                                        </h:outputText>          
                                    </h:panelGrid>
                                </div>	
                                
                                
                                
                                <hr> </hr>							        	
								        
								        
								            <h:panelGrid columns="2" cellpadding="10">
								            
								              <p:dataTable var="detail" value="#{tarif7ayyaBean.detailsGaranties}">
												    <p:column headerText="Garantie">
												        <h:outputText value="#{detail.libelle}" />
												    </p:column>
												 
												    <p:column headerText="Capital calculé au TMG">
												        <h:outputText value="#{detail.capital}" >
												        <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												    </p:column>
												 
												    <p:column headerText="Prime Ann.">
												        <h:outputText value="#{detail.prime * tarif7ayyaBean.nombrePeriodePourFract}" >
												        <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												    </p:column>
												 
												    
												</p:dataTable>  
								                
								                    
								            </h:panelGrid>
								            
								            <hr> </hr>
								            
								            
								             
								            
								            
								            <p:fieldset legend="Total Annuel" style="margin-bottom:20px">
									            
												<table>
												  <tr>
												    <th class="mtd"> <h:outputText value="Prime Nette" /></th>
												    <th class="mtd"> <h:outputText value="Accésoires" /></th>
												    <th class="mtd"> <h:outputText value="Taxes" /></th>
												    <th class="mtd"> <h:outputText value="Total" /> </th>
												  </tr>
												  <tr>
												    <td><h:outputText value="#{tarif7ayyaBean.pnette_annuel}" >
												    <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												    </td>
												    <td><h:outputText value="#{tarif7ayyaBean.accessoires}" >
												    <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												     </td>
												    <td><h:outputText value="#{tarif7ayyaBean.taxes}" >
												    <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												    </td>
												    <td><h:outputText value="#{tarif7ayyaBean.total_annuel}" >
												    <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												    </td>
												  </tr>
												  
												  
												</table>


									        </p:fieldset>
									        
									        
									        <hr> </hr>
									        
									        <p:fieldset legend="Commission" style="margin-bottom:20px">
									            <h:panelGrid columns="2" cellpadding="5">
			                                        <p:outputLabel  value="Commission comptant: " for="commission" styleClass="label label-danger price"/>
			                                        <h:outputText id="commission"   value="#{tarif7ayyaBean.accessoires}"  styleClass="label label-info price">
			                                         <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												    </h:outputText>         
			                                    </h:panelGrid>
									        </p:fieldset>
									        
									        
									        
									        <hr> </hr>
									        
									        
									        <p:fieldset legend="Détail de la taxe" style="margin-bottom:20px">
									             <h:panelGrid columns="2" cellpadding="5">
			                                        <p:outputLabel  value="FGA: " for="fa" styleClass="label label-danger price"/>
			                                        <h:outputText id="fa"   value="#{tarif7ayyaBean.fga}"  styleClass="label label-info price">
			                                         <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>												 
			                                        </h:outputText>          
			                                    </h:panelGrid>
									        </p:fieldset>
								            
								           
                                           
                                        	    
								            
								            
								        </p:tab>
								        
								        
								        
								        <p:tab title="Evolution des garanties">
								        
								        <br></br>
								            <h:panelGrid columns="2" cellpadding="10">
								               
								             
								              <p:dataTable var="detailsE" value="#{tarif7ayyaBean.detailsEvolutionGaranties}"
								              scrollable="true" scrollWidth="700">
												    <p:column headerText="Année">
												        <h:outputText value="#{detailsE.annee}" >
												        
												        </h:outputText>
												    </p:column>
												 
												    <p:column headerText="Prime commerciale">
												        <h:outputText value="#{detailsE.prime_comm}" >
												        <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												    </p:column>
												 
<!-- 												    <p:column headerText="Prime à capitaliser"> -->
<!-- 												        <h:outputText value="#{detailsE.prime_capit}" > -->
<!-- 												        <f:convertNumber pattern="#,##0.000" locale="fr_FR"/> -->
<!-- 												        </h:outputText> -->
<!-- 												    </p:column> -->
												    
												    <p:column headerText="Capital constitué TMG">
												        <h:outputText value="#{detailsE.capital_tmg}" >
												        <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												    </p:column>
												    
<!-- 												    <p:column headerText="Capital constitué au Taux Réel"> -->
<!-- 												        <h:outputText value="#{detailsE.capital_taux_reel}" > -->
<!-- 												        <f:convertNumber pattern="#,##0.000" locale="fr_FR"/> -->
<!-- 												        </h:outputText> -->
<!-- 												    </p:column> -->
												    
<!-- 												    <p:column headerText="Bénéfices Réalisés"> -->
<!-- 												        <h:outputText value="#{detailsE.benefices_realises}" > -->
<!-- 												        <f:convertNumber pattern="#,##0.000" locale="fr_FR"/> -->
<!-- 												        </h:outputText> -->
<!-- 												    </p:column> -->
												    
												    <p:column headerText="Participation aux Bénéfices">
												        <h:outputText value="#{detailsE.participation_benef}" >
												        <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												    </p:column>
												    
												    <p:column headerText="Epargne Constituée en fin d'année">
												        <h:outputText value="#{detailsE.epargne_fin_annee}" >
												        <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												    </p:column>
												    
<!-- 												    <p:column headerText="Gain Financier"> -->
<!-- 												        <h:outputText value="#{detailsE.gain_financier}" > -->
<!-- 												        <f:convertNumber pattern="#,##0.000" locale="fr_FR"/> -->
<!-- 												        </h:outputText> -->
<!-- 												    </p:column> -->
												    
												    <p:column headerText="Gain fiscal Annuel">
												        <h:outputText value="#{detailsE.gain_fisc_annuel}" >
												        <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												    </p:column>
												    
												    <p:column headerText="Valeur rachat">
												        <h:outputText value="#{detailsE.valeur_rachat}" >
												        <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												    </p:column>
												    
												   <p:column headerText="Cumul Versements">
												        <h:outputText value="#{detailsE.cumul_vers}" >
												        <f:convertNumber pattern="#,##0.000" locale="fr_FR" />
												        </h:outputText>
												    </p:column>
												 
												    
												</p:dataTable>  
								               

								            </h:panelGrid>
								        </p:tab>
								        
								        
								     <p:tab title="Bilan Financier">
								        
								        <br></br> <br></br>
								            
								               
								             
								             	<table>
												  <tr>
												    <th class="mtd"> <h:outputText value="Prime Versée" /></th>
												    <th class="mtd"> <h:outputText value="Epargne Prévisionnelle" /></th>
												    <th class="mtd"> <h:outputText value="Gain Financier" /></th>
												    <th class="mtd"> <h:outputText value="Economie D'impôt" /> </th>
												    <th class="mtd"> <h:outputText value="Gain total" /> </th>
												  </tr>
												  <tr>
												    <td><h:outputText value="#{tarif7ayyaBean.bilanFinancierHayyaDTO.primeversee}" >
												    <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												    </td>
												    <td><h:outputText value="#{tarif7ayyaBean.bilanFinancierHayyaDTO.epargneprev}" >
												    <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												     </td>
												    <td><h:outputText value="#{tarif7ayyaBean.bilanFinancierHayyaDTO.gainfinancier}" >
												    <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												    </td>
												    <td><h:outputText value="#{tarif7ayyaBean.bilanFinancierHayyaDTO.econimpot}" >
												    <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												    </td>
												    <td><h:outputText value="#{tarif7ayyaBean.bilanFinancierHayyaDTO.gaintotal}" >
												    <f:convertNumber pattern="#,##0.000" locale="fr_FR"/>
												        </h:outputText>
												    </td>
												  </tr>
												  
												  
												</table>  
								               

								            
								        </p:tab>
								        
								
								        
								        
								    </p:tabView>
    
                                </div>
                              <div  class="form-actions">
                              <p:messages  autoUpdate="true" showDetail="true"/>
                              
                              <p:commandLink  type="idvaliderPrposition"  id="validerPrposition"  
                              action= "#{tarif7ayyaBean.generateDevis7ayya()}" 
                              update="form" 
                              styleClass="btn btn-success"  value="Valider Proposition" 
                              disabled="#{!h7ayyaController.disabledGenerateDevis}"
                              />
                              
                              <p:commandLink  ajax="false" target="_blank"  type="idImprimer=" 
                              action= "#{tarif7ayyaBean.generateDevis()}" 
                              id="generateDevis" update="form"  
                              styleClass="btn btn-info"  value="Imprimer Devis" 
                              disabled="#{h7ayyaController.disabledGenerateDevis}" />
                            
                            
                            <p:commandLink  type="idvaliderAdhesion"  id="validerAdhesion"  
                              action= "#{tarif7ayyaBean.suiteContrat7ayya()}" 
                              update="form" 
                              styleClass="btn btn-success"  value="Valider le contrat" 
                              disabled="#{h7ayyaController.disabledGenerateDevis}"
                              />
                              
                               </div> 
                               
                               
                               <p:blockUI block="form" trigger="validerPrposition generateDevis">
						        Chargement...<br />
						        <p:graphicImage value="../img/loaders/page_loader.gif"/>
					    	</p:blockUI>
                               
                               
                            </h:form>
                            <h:form>
                            
                            
                            
                            <h:commandLink  action="#{tarif7ayyaBean.returnToDevis7ayya()}"  value="Retour" >
                             <img src="${facesContext.externalContext.requestContextPath}/images/back.png" width="25" height="25"/>
                            
                            </h:commandLink>
                            
                            
                            
                            
                            
                            
                        </h:form>
                        </div>  
                        
                    </div>       
                </section> 
            </div>  
        </div> 
        </h:body>                  
    </ui:define>
</ui:composition>
