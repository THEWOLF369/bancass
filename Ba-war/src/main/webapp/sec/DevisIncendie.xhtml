<ui:composition template="/sec/template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="body">
	<!-- <f:metadata>
			<f:event type="preRenderView" listener="#{devisIncendieBean.loadProposition()}" />
		</f:metadata>-->
		<style type="text/css">
.labelWidth {
	width: 150px;
}

.ui-inputfield,.ui-widget-content .ui-inputfield,.ui-widget-header .ui-inputfield
	{
	background: 0 !important;
	background-color: white !important;
	box-shadow: none !important;
}

label {
	color: black;
}

.orangeButton {
	background: 0 !important;
	color: #fff !important;
	text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.25) !important;
	background-color: #faa732 !important;
	background-image: -moz-linear-gradient(top, #fbb450, #f89406) !important;
	background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#fbb450),
		to(#f89406)) !important;
	background-image: -webkit-linear-gradient(top, #fbb450, #f89406)
		!important;
	background-image: -o-linear-gradient(top, #fbb450, #f89406) !important;
	background-image: linear-gradient(to bottom, #fbb450, #f89406)
		!important;
	background-repeat: repeat-x !important;
	border-color: #f89406 #f89406 #ad6704 !important;
	border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25)
		!important;
}

.redButton {
	color: #fff !important;
	text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.25) !important;
	background-color: #da4f49 !important;
	background-image: -moz-linear-gradient(top, #ee5f5b, #bd362f) !important;
	background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#ee5f5b),
		to(#bd362f)) !important;
	background-image: -webkit-linear-gradient(top, #ee5f5b, #bd362f)
		!important;
	background-image: -o-linear-gradient(top, #ee5f5b, #bd362f) !important;
	background-image: linear-gradient(to bottom, #ee5f5b, #bd362f)
		!important;
	background-repeat: repeat-x !important;
	border-color: #bd362f #bd362f #802420 !important;
	border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25)
		!important;
}

.greenButton {
	color: #fff !important;
	text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.25) !important;
	background-color: #5bb75b !important;
	background-image: -moz-linear-gradient(top, #62c462, #51a351) !important;
	background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#62c462),
		to(#51a351)) !important;
	background-image: -webkit-linear-gradient(top, #62c462, #51a351)
		!important;
	background-image: -o-linear-gradient(top, #62c462, #51a351) !important;
	background-image: linear-gradient(to bottom, #62c462, #51a351)
		!important;
	background-repeat: repeat-x !important;
	border-color: #51a351 #51a351 #387038 !important;
	border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25)
		!important;
}

textarea:focus,input[type="text"]:focus,input[type="password"]:focus,input[type="datetime"]:focus,input[type="datetime-local"]:focus,input[type="date"]:focus,input[type="month"]:focus,input[type="time"]:focus,input[type="week"]:focus,input[type="number"]:focus,input[type="email"]:focus,input[type="url"]:focus,input[type="search"]:focus,input[type="tel"]:focus,input[type="color"]:focus,.uneditable-input:focus
	{
	border: 1px solid #d5d5d5 !important;
}

.ui-autocomplete {
	background: 0 !important;
	border: 0 !important;
}

.ui-autocomplete .ui-autocomplete-dropdown {
	height: 29px;
}
</style>

<style type="text/css">
    .dataInputNumber input  {
   width:30px;
   background-color: white;
}

.idref_class {
/* width:350px; */
}
</style>
<h:body style=" border: none;" rendered="#{!gestionProfil.souscriptionIncendie}" >
    <ul class="breadcrumb br_styled no_space">
            <li class="active">Accès non autorisé</li>
        </ul>
        <ul class="page_info">
         <center>
         <img src="../images/autorisation.jpg"  height="15%" width="15%"/>
         </center>
    </ul>
    </h:body>
 <h:body style=" border: none;" rendered="#{gestionProfil.souscriptionIncendie}">  

      <ul class="breadcrumb br_styled no_space">                              
                <li class="active">Devis Incendie</li>
                <li class="active">
			
			  <img src="${facesContext.externalContext.requestContextPath}/images/right.png" width="17" height="17"/>
			</li>
			<li class="active">Adhesion</li>
      </ul> 
              <ul class="page_info">             
			   <h:panelGroup id="panelGroup">
				<h:form id="formDevis">
				<p:growl id="growl"  /> 
				 <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" />
					<h:panelGrid columns="3"  columnClasses="labelWidth, ui-grid-col-3">
						<label class="bold">Police </label>
						<h:selectOneMenu id="numpol" styleClass="form-control" value="#{devisIncendieBean.numplc}" >
							<f:selectItems value="#{devisIncendieBean.listnumplc}" />
						</h:selectOneMenu>
						<p:message for="numpol" />
						
                         
                         <label class="bold"> Référence crédit </label>
							<h:panelGrid columns="2"
								columnClasses="labelWidth, ui-grid-col-3">
								<h:inputText id="idref" styleClass="form-control" value="#{devisIncendieBean.refCredit}" class="idref_class"/>
								<p:commandButton value="" process="@parent" id="btnRef"
									oncomplete='$("#loader_cont").fadeOut();' update="formDevis"
									style="height: 35px;width: 35px;  
								background-image: url(${facesContext.externalContext.requestContextPath}/images/website.png)"
									action="#{devisIncendieBean.rechercherRefCreditDepuisWS()}">
								</p:commandButton>

							</h:panelGrid>
							<p:message for="idref " />
                         
						<label class="bold"> Identifiant client </label>
						<h:panelGrid columns="2" columnClasses="labelWidth, ui-grid-col-3">
						<h:inputText id="idcin" styleClass="form-control"
							value="#{clientBean.client.identifiant}" disabled="true" />
						<p:commandButton value="Client" process="@this" 
							styleClass="orangeButton" 
							action="#{devisIncendieBean.navigateToClientPage()}">
						</p:commandButton>
						</h:panelGrid>
						<p:message for="idcin"/>
						  
						 
						               
						<label class="bold"> Date d'effet </label>
						<p:calendar id="calEffDate" styleClass="combo-style" 
							value="#{devisIncendieBean.effDate}" pattern="dd/MM/yyyy"
							mindate="#{devisIncendieBean.aujourdhui}" showButtonPanel="true"
							required="true" 
							requiredMessage="La date d'effet est obligatoire."
							>
							
							<p:ajax event="dateSelect" update=":formDevis:txtdatefin" 
								listener="#{devisIncendieBean.updateDuree()}" />
								<p:ajax event="change" update=":formDevis:txtdatefin" 
								listener="#{devisIncendieBean.updateDuree()}" />
							
						</p:calendar>
                        <p:message for="calEffDate" />
			</h:panelGrid>
			
			<h:panelGrid  columns="7" columnClasses="labelWidth, ui-grid-col-3">
						<label class="bold">Durée</label>
						
						<p:inputNumber id="nbannee"    styleClass="dataInputNumber"
							value="#{devisIncendieBean.nbannee}" 
							validatorMessage="La durée ne doit pas être nulle" 
							requiredMessage="La durée est obligatoire"
							minValue="0" maxValue="99"
							 onclick="this.focus();this.select()" 
							 readonly="#{devisIncendieBean.cod_societe.equals('002707PPM000')}">
							  
							 
							 
    
    
							<p:ajax event="blur" update=":formDevis:txtdatefin" 
								listener="#{devisIncendieBean.updateDuree()}" />
						</p:inputNumber>
						<label class="bold">Année(s) </label>
						
						 
						
						<p:inputNumber id="nbmois" value="#{devisIncendieBean.nbmois}" styleClass="dataInputNumber" style="margin-left: 20px;"
						validatorMessage="La durée ne doit pas être nulle"  
						minValue="0" maxValue="11" onclick="this.focus();this.select()"
						  requiredMessage="La durée est obligatoire"
						  readonly="#{devisIncendieBean.cod_societe.equals('002707PPM000')}">  
						 
                    <p:ajax event="blur" update=":formDevis:txtdatefin" 
								listener="#{devisIncendieBean.updateDuree()}" /> 
                </p:inputNumber>
						
						<label class="bold">Mois</label>
						<p:message for="nbmois" />
						<p:message for="nbannee" />
						
						 
						</h:panelGrid>
					 
					
						
								
				<h:panelGrid columns="3"  columnClasses="labelWidth, ui-grid-col-3">
						<label class="bold"> Date d'expiration </label>
						<h:inputText styleClass="form-control" id="txtdatefin"
							value="#{devisIncendieBean.datefin}" disabled="true">
							<f:convertDateTime pattern="dd/MM/yyyy" />
						</h:inputText>
						<p:message for="txtdatefin" />
					
						<label class="bold">Montant du prêt </label>
						<p:inputText id="txtcapitalini" styleClass="form-control"
							value="#{devisIncendieBean.capital}" onclick="this.focus();this.select()" 
								
							validatorMessage="capital différent de zéro ." required="true"
							requiredMessage="capital est obligatoire"
							readonly="#{devisIncendieBean.cod_societe.equals('002707PPM000')}">
							<f:convertNumber pattern="#0.000" />
						</p:inputText>
						<p:message for="txtcapitalini" />
						
						
						<p:outputLabel value="Adresse du risque:" for="txtAdr" />
						<p:inputText id="txtAdr" styleClass="form-control"
							value="#{devisIncendieBean.adhesion.adresse}"  />
						<p:message for="txtAdr" />
						
						
						
						<p:outputLabel value="Gouvernorat du risque:" for="gouvernerat" />
							<p:selectOneMenu id="gouvernerat" styleClass="form-control"   value="#{devisIncendieBean.adhesion.gouver}"   
						 
						filter="true" filterMatchMode="contains" style="width:60px" >
						
							 <p:ajax event="itemSelect" process="@this" listener="#{devisIncendieBean.updateListCodePostalActionListener()}" update="txtZipCode"   />
							 <f:selectItem itemLabel="Selectionnez gouvernorat..." value="#{null}" />
							 <f:selectItems value="#{devisIncendieBean.allGouverneras}"  />
							 
						</p:selectOneMenu>

                             <p:message for="gouvernerat" />
						
						
						
						<p:outputLabel value="Code postale du risque:" for="txtZipCode" />
						
						     <p:selectOneMenu id="txtZipCode" styleClass="form-control" value="#{devisIncendieBean.selectedLocgouv.code}"  
							            filter="true" filterMatchMode="contains" style="width:60px" >
							           
							       <p:ajax event="itemSelect" process="@this" listener="#{devisIncendieBean.locgouvSelectListened}" update="txtLocalite"   />
							       <f:selectItem itemLabel="Selectionnez code postal..." itemValue="" noSelectionOption="true" />
							        <f:selectItems value="#{devisIncendieBean.allCodePostalByGouvernera}" var="ojectCodePostal" 
							        itemLabel="#{ojectCodePostal.codePosta} #{ojectCodePostal.localite}"  itemValue="#{ojectCodePostal.code}"/>
							        
					             	</p:selectOneMenu> 
						
						
						 
						
						<p:message for="txtZipCode" />
						
						 
						
						<p:outputLabel value="Ville du risque:" for="txtLocalite" />
					    <h:panelGroup id="txtLocalite">
					    <h:inputText  styleClass="form-control" 
							value="#{devisIncendieBean.adhesion.localite}" disabled="true" /> 
					    </h:panelGroup>	
						
							<p:message for="txtLocalite" />
							
							
						
					
	         </h:panelGrid>	
	         
	         
	         
	         
	         
	      
	         
	        <center> 
					
                       <div class="form-actions">

							<h:commandLink type="idcancel" action="#{devisIncendieBean.newDevis()}"
								styleClass="btn btn-danger" value="Réinitialiser" update="panelGroup"  ajax="true"/>
							<h:commandLink type="idTarifier" 
								action="#{devisIncendieBean.calculTarif()}" styleClass="btn btn-success"
								value="Tarifier" />

						</div>
						</center>
						
						
						
						
						<p:blockUI block="formDevis" trigger="btnRef">
					        Chargement des données...<br />
					        <p:graphicImage value="../img/loaders/page_loader.gif"/>
					    </p:blockUI>
						
						
			</h:form>
			</h:panelGroup>
			 </ul>


</h:body>

</ui:define>
</ui:composition>
