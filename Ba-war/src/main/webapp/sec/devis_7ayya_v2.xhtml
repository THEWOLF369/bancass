<style>

/* Fenêtre de confirmation */
.modern-confirm {
    border-radius: 12px !important;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25) !important;
}

/* En-tête */
.modern-confirm .ui-dialog-titlebar {
    background: #f8f9fa !important;
    border: none !important;
    padding: 18px 22px !important;
}

.modern-confirm .ui-dialog-title {
    font-size: 20px !important;
    font-weight: 600 !important;
    color: #343a40 !important;
}

/* Contenu */
.modern-confirm .ui-dialog-content {
    padding: 25px !important;
    text-align: center;
    font-size: 16px;
    color: #555;
    line-height: 1.6;
}

/* Icône */
.modern-confirm .ui-confirm-dialog-severity {
    color: #f0ad00 !important;
    font-size: 35px !important;
    margin-right: 15px;
}

/* Zone boutons */
.modern-confirm .ui-dialog-buttonpane {
    border: none !important;
    padding: 15px 20px 20px !important;
    text-align: center;
}

/* Annuler */
.modern-cancel {
    background: #e9ecef !important;
    border: 1px solid #dee2e6 !important;
    color: #495057 !important;
    border-radius: 6px !important;
    padding: 9px 20px !important;
    margin-right: 10px !important;
}

/* Oui, valider */
.modern-confirm-btn {
    background: #28a745 !important;
    border: 1px solid #28a745 !important;
    color: white !important;
    border-radius: 6px !important;
    padding: 9px 20px !important;
}

/* Hover */
.modern-confirm-btn:hover {
    background: #218838 !important;
    border-color: #218838 !important;
}

.modern-cancel:hover {
    background: #dfe2e5 !important;
}

</style>
