<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core">

<h:head>

    <meta charset="UTF-8" />
    <title>Mot de passe oublié</title>

    <link rel="stylesheet" type="text/css" href="css/demo1.css" />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <link rel="stylesheet" type="text/css" href="css/animate-custom.css" />

    <style>

        .button {
            width: 60%;
            margin: 10px auto;
            display: block;
            background: rgb(12, 82, 50);
            color: white;
            border: 1px solid rgb(12, 82, 50);
            padding: 10px;
            font-size: 16px;
            border-radius: 3px;
            cursor: pointer;
        }

        .ui-inputfield {
            width: 95% !important;
        }

        .center {
            text-align: center;
        }

    </style>

</h:head>

<h:body>

<div class="container">

    <header>
        <img src="images/star2018.png" height="130" width="230"/>

        <h:panelGroup rendered="#{login.alyssaLogoPresent}">
            <img src="images/logoALYSSA.png" height="130" width="230"/>
        </h:panelGroup>

        <br/>
    </header>

    <section>
        <div id="container_demo">
            <div id="wrapper">

                <div id="login" class="animate form">

                    <h:form id="fpForm">

                        <h1>Récupération du mot de passe</h1>

                        <p:messages id="msgs" autoUpdate="true"/>

                        <!-- ========================= -->
                        <!-- ETAPE 1 : ENVOI OTP -->
                        <!-- ========================= -->

                        <h:panelGroup rendered="#{!forgotPasswordBean.otpSent}">

                            <p>
                                <label>Nom d'utilisateur ou Email</label>
                                <p:inputText value="#{forgotPasswordBean.loginOrEmail}"
                                             required="true"
                                             style="width:95%;" />
                            </p>

                            <p class="center">
                                <p:commandButton value="Envoyer OTP"
                                                 action="#{forgotPasswordBean.sendOtp}"
                                                 update="@form"
                                                 styleClass="button"/>
                            </p>

                        </h:panelGroup>

                        <!-- ========================= -->
                        <!-- ETAPE 2 : RESET PASSWORD -->
                        <!-- ========================= -->

                        <h:panelGroup rendered="#{forgotPasswordBean.otpSent}">

                            <p>
                                <label>Code OTP</label>
                                <p:inputText value="#{forgotPasswordBean.otp}" style="width:95%;" />
                            </p>

                            <p>
                                <label>Nouveau mot de passe</label>
                                <p:password value="#{forgotPasswordBean.newPassword}"
                                            feedback="true"
                                            style="width:95%;" />
                            </p>

                            <p>
                                <label>Confirmer mot de passe</label>
                                <p:password value="#{forgotPasswordBean.confirmPassword}"
                                            style="width:95%;" />
                            </p>

                            <p class="center">

                                <p:commandButton value="Réinitialiser"
                                                 action="#{forgotPasswordBean.resetPassword}"
                                                 update="@form"
                                                 styleClass="button"/>

                            </p>

                        </h:panelGroup>

                        <!-- RETOUR -->
                        <div class="center" style="margin-top:20px;">

                            <p:commandLink value="Retour à la connexion"
                                           action="index?faces-redirect=true"
                                           immediate="true"
               								process="@this"
                                           style="color:#0c5232;font-weight:bold;" />

                        </div>

                    </h:form>

                </div>

            </div>
        </div>
    </section>

</div>

</h:body>
</html>
