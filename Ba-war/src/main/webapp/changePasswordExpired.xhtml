<?xml version='1.0' encoding='UTF-8' ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core">

<h:head>

    <meta charset="UTF-8"/>

    <title>Mot de passe expiré</title>

    <link rel="stylesheet"
          type="text/css"
          href="css/demo1.css"/>

    <link rel="stylesheet"
          type="text/css"
          href="css/style.css"/>

    <link rel="stylesheet"
          type="text/css"
          href="css/animate-custom.css"/>

    <link rel="shortcut icon"
          type="image/x-icon"
          href="images/favicon.ico"/>


    <style>

        /* ================================================= */
        /* GENERAL                                           */
        /* ================================================= */

        body {
            margin:0;
            background:#f4f7f6;
            font-family:"Segoe UI", Arial, sans-serif;
        }


        /* ================================================= */
        /* CONTAINER                                         */
        /* ================================================= */

        .bank-container {

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;
        }


        /* ================================================= */
        /* HEADER                                            */
        /* ================================================= */

        .bank-header {

            display:flex;

            justify-content:center;

            align-items:center;

            gap:25px;

            margin-bottom:25px;
        }


        .bank-logo {

            width:180px;

            height:100px;

            object-fit:contain;
        }


        /* ================================================= */
        /* CARD                                              */
        /* ================================================= */

        .bank-card {

            width:430px;

            background:#ffffff;

            padding:35px 40px;

            border-radius:18px;

            box-shadow:
                0 12px 35px rgba(0,0,0,.10);

            border-top:6px solid #0c5232;

            animation:showCard .35s ease;
        }


        @keyframes showCard {

            from {
                opacity:0;
                transform:translateY(15px);
            }

            to {
                opacity:1;
                transform:translateY(0);
            }
        }


        /* ================================================= */
        /* ICON                                              */
        /* ================================================= */

        .bank-icon {

            width:75px;

            height:75px;

            margin:0 auto 15px;

            border-radius:50%;

            background:#e8f2ed;

            display:flex;

            justify-content:center;

            align-items:center;

            color:#0c5232;

            font-size:34px;
        }


        /* ================================================= */
        /* TITLE                                             */
        /* ================================================= */

        .bank-title {

            text-align:center;

            color:#0c5232;

            font-size:24px;

            font-weight:600;

            margin-bottom:10px;
        }


        /* ================================================= */
        /* DESCRIPTION                                       */
        /* ================================================= */

        .bank-description {

            text-align:center;

            color:#666;

            font-size:14px;

            line-height:1.6;

            margin-bottom:25px;
        }


        /* ================================================= */
        /* MESSAGES                                          */
        /* ================================================= */

        .ui-messages {

            margin:15px 0 !important;

            border-radius:8px !important;

            font-size:13px;
        }


        /* ================================================= */
        /* INPUT                                             */
        /* ================================================= */

        .bank-field {

            margin-bottom:20px;
        }


        .bank-field label {

            display:block;

            margin-bottom:7px;

            font-size:13px;

            font-weight:600;

            color:#344;
        }


        .bank-field .ui-inputfield {

            width:100% !important;

            height:42px;

            border-radius:10px !important;

            border:1px solid #d6ddd9 !important;

            padding:10px !important;

            box-sizing:border-box;
        }


        .bank-field .ui-inputfield:focus {

            border-color:#0c5232 !important;

            box-shadow:
                0 0 0 3px rgba(12,82,50,.15) !important;
        }


        /* ================================================= */
        /* PASSWORD                                          */
        /* ================================================= */

        .password-wrapper {

            display:flex;

            align-items:center;

            width:100%;
        }


        .password-wrapper .ui-inputfield {

            flex:1;
        }


        .password-wrapper button {

            margin-left:8px;

            width:42px;

            height:40px;
        }


        /* ================================================= */
        /* BUTTONS                                           */
        /* ================================================= */

        .bank-actions {

            margin-top:25px;
        }


        .bank-primary {

            width:100%;

            height:45px;

            background:#0c5232 !important;

            border:none !important;

            border-radius:10px !important;

            color:white !important;

            font-weight:600;
        }


        .bank-primary:hover {

            background:#083d25 !important;
        }


        .bank-secondary {

            width:100%;

            height:42px;

            margin-top:12px;

            background:white !important;

            border:1px solid #0c5232 !important;

            border-radius:10px !important;

            color:#0c5232 !important;
        }


        /* ================================================= */
        /* RESPONSIVE                                        */
        /* ================================================= */

        @media screen and (max-width:600px) {

            .bank-card {

                width:90%;

                padding:25px;
            }

            .bank-title {

                font-size:20px;
            }

            .bank-description {

                font-size:13px;
            }

            .bank-logo {

                width:150px;

                height:80px;
            }

        }

    </style>

</h:head>


<h:body>


    <div class="bank-container">

        <div>


            <!-- ================================================= -->
            <!-- HEADER / LOGOS                                    -->
            <!-- ================================================= -->

            <header class="bank-header">

                <img src="images/star2018.png"
                     class="bank-logo"
                     alt="Logo"/>


                <h:panelGroup rendered="#{login.alyssaLogoPresent}">

                    <img src="images/logoALYSSA.png"
                         class="bank-logo"
                         alt="Logo ALYSSA"/>

                </h:panelGroup>

            </header>



            <!-- ================================================= -->
            <!-- FORM                                               -->
            <!-- ================================================= -->

            <h:form id="changePasswordForm">


                <!-- ================================================= -->
                <!-- LOADING                                           -->
                <!-- ================================================= -->

                <p:blockUI block="changePasswordForm"
                           widgetVar="loadingAction">

                    <div style="
                        width:320px;
                        padding:35px;
                        background:white;
                        border-radius:15px;
                        text-align:center;">

                        <i class="fa fa-spinner"
                           style="
                               font-size:40px;
                               color:#0c5232;">
                        </i>

                        <h3>
                            Modification en cours
                        </h3>

                        <p>
                            Veuillez patienter...
                        </p>

                    </div>

                </p:blockUI>



                <!-- ================================================= -->
                <!-- CARD                                               -->
                <!-- ================================================= -->

                <div class="bank-card">


                    <!-- ICON -->

                    <div class="bank-icon">

                        <i class="fa fa-key"></i>

                    </div>


                    <!-- TITLE -->

                    <div class="bank-title">

                        Mot de passe expiré

                    </div>


                    <!-- MESSAGES -->

                    <p:messages id="messages"
                                autoUpdate="true"
                                showDetail="true"
                                escape="false"/>


                    <!-- DESCRIPTION -->

                    <div class="bank-description">

                        Votre mot de passe a expiré.

                        <br/>

                        Veuillez saisir votre ancien mot de passe
                        puis définir un nouveau mot de passe.

                    </div>



                    <!-- ================================================= -->
                    <!-- LOGIN                                             -->
                    <!-- ================================================= -->

                    <div class="bank-field">

                        <p:outputLabel
                            value="Identifiant"
                            for="login"/>


                        <p:inputText
                            id="login"
                            value="#{otpResetBean.login}"
                            required="true"
                            requiredMessage="L'identifiant est obligatoire."
                            autocomplete="username"/>

                    </div>



                    <!-- ================================================= -->
                    <!-- ANCIEN MOT DE PASSE                                -->
                    <!-- ================================================= -->

                    <div class="bank-field">

                        <p:outputLabel
                            value="Ancien mot de passe"
                            for="oldPwd"/>


                        <div class="password-wrapper">


                            <p:inputText
                                id="oldPwd"
                                value="#{otpResetBean.oldPassword}"
                                type="#{otpResetBean.showOldPassword ? 'text' : 'password'}"
                                required="true"
                                requiredMessage="L'ancien mot de passe est obligatoire."
                                autocomplete="current-password"/>


                            <p:commandButton
                                id="toggleOldBtn"

                                icon="#{otpResetBean.showOldPassword
                                        ? 'fa fa-eye-slash'
                                        : 'fa fa-eye'}"

                                actionListener="#{otpResetBean.toggleOldPasswordVisibility}"

                                update="oldPwd toggleOldBtn"

                                process="@this oldPwd"

                                type="submit"/>

                        </div>

                    </div>



                    <!-- ================================================= -->
                    <!-- NOUVEAU MOT DE PASSE                              -->
                    <!-- ================================================= -->

                    <div class="bank-field">

                        <p:outputLabel
                            value="Nouveau mot de passe"
                            for="newPwd"/>


                        <div class="password-wrapper">


                            <p:inputText
                                id="newPwd"
                                value="#{otpResetBean.newPassword}"
                                type="#{otpResetBean.showNewPassword ? 'text' : 'password'}"
                                required="true"
                                requiredMessage="Le nouveau mot de passe est obligatoire."
                                autocomplete="new-password"/>


                            <p:commandButton
                                id="toggleNewBtn"

                                icon="#{otpResetBean.showNewPassword
                                        ? 'fa fa-eye-slash'
                                        : 'fa fa-eye'}"

                                actionListener="#{otpResetBean.toggleNewPasswordVisibility}"

                                update="newPwd toggleNewBtn"

                                process="@this newPwd"

                                type="submit"/>

                        </div>

                    </div>



                    <!-- ================================================= -->
                    <!-- CONFIRMATION                                      -->
                    <!-- ================================================= -->

                    <div class="bank-field">

                        <p:outputLabel
                            value="Confirmation mot de passe"
                            for="confirmPwd"/>


                        <div class="password-wrapper">


                            <p:inputText
                                id="confirmPwd"
                                value="#{otpResetBean.confirmPassword}"
                                type="#{otpResetBean.showConfirmPassword ? 'text' : 'password'}"
                                required="true"
                                requiredMessage="La confirmation du mot de passe est obligatoire."
                                autocomplete="new-password"/>


                            <p:commandButton
                                id="toggleConfirmBtn"

                                icon="#{otpResetBean.showConfirmPassword
                                        ? 'fa fa-eye-slash'
                                        : 'fa fa-eye'}"

                                actionListener="#{otpResetBean.toggleConfirmPasswordVisibility}"

                                update="confirmPwd toggleConfirmBtn"

                                process="@this confirmPwd"

                                type="submit"/>

                        </div>

                    </div>



                    <!-- ================================================= -->
                    <!-- ACTIONS                                           -->
                    <!-- ================================================= -->

                    <div class="bank-actions">


                        <p:commandButton

                            id="btnChangePassword"

                            value="Modifier mon mot de passe"

                            action="#{otpResetBean.changeExpiredPassword}"

                            update="changePasswordForm"

                            onstart="PF('loadingAction').show();"

                            oncomplete="PF('loadingAction').hide();"

                            styleClass="bank-primary"/>


                        <p:commandButton

                            value="Retour à la connexion"

                            action="#{otpResetBean.goToLogin}"

                            ajax="false"

                            immediate="true"

                            styleClass="bank-secondary"/>


                    </div>


                </div>



                <!-- ================================================= -->
                <!-- FOOTER                                             -->
                <!-- ================================================= -->

                <div style="
                    text-align:center;
                    margin-top:25px;
                    color:#777;
                    font-size:12px;">

                    <i class="fa fa-lock"></i>

                    Connexion sécurisée -
                    Vos informations sont protégées

                </div>


            </h:form>

        </div>

    </div>


</h:body>

</html>
