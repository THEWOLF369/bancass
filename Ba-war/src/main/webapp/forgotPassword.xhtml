<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core">

<h:head>

    <meta charset="UTF-8" />
    <title>Mot de passe oublié</title>

    <link rel="stylesheet" type="text/css" href="css/demo1.css" />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <link rel="stylesheet" type="text/css" href="css/animate-custom.css" />

    <style>

        .button {
            width: 60%;
            margin: 10px auto;
            display: block;
            background: rgb(12, 82, 50);
            color: white;
            border: 1px solid rgb(12, 82, 50);
            padding: 10px;
            font-size: 16px;
            border-radius: 3px;
            cursor: pointer;
        }

        .ui-inputfield {
            width: 95% !important;
        }

        .center {
            text-align: center;
        }

    </style>

</h:head>

<h:body>

<div class="container">

    <header>
        <img src="images/star2018.png" height="130" width="230"/>

        <h:panelGroup rendered="#{login.alyssaLogoPresent}">
            <img src="images/logoALYSSA.png" height="130" width="230"/>
        </h:panelGroup>

        <br/>
    </header>

    <section>

        <div id="container_demo">
            <div id="wrapper">
            
            <div id="login" >

                <h:form id="forgotForm">
                
                <h1>Récupération du mot de passe</h1>

                    <!-- MESSAGES -->
<!--                     <p:growl id="growl" -->
<!--                              showDetail="true" -->
<!--                              life="5000"/> -->
                             
						<p:growl id="growl"
						         showDetail="true"
						         autoUpdate="true"/>
						
						<p:messages id="messages"
						            showDetail="true"
						            autoUpdate="true"
						            escape="false"/>                         

                    <!-- STEPS -->
                    <p:steps activeIndex="#{forgotPasswordBean.step - 1}">

                        <p:menuitem value="Login"/>
                        <p:menuitem value="OTP"/>
                        <p:menuitem value="Mot de passe"/>

                    </p:steps>

                    <br/><br/>

                    <!-- STEP 1 : LOGIN -->
                    <p:panel rendered="#{forgotPasswordBean.step eq 1}"
                             header="Mot de passe oublié">

                        <p:outputLabel value="Login"/>

                        <p:inputText id="login"
                                     value="#{forgotPasswordBean.login}"
                                     required="true"
                                     style="width:100%"/>

                        <br/><br/>

                        <p:commandButton id="btnSendOtp"
                                         value="Envoyer OTP"
                                         action="#{forgotPasswordBean.sendOtp}"
                                         update="forgotForm"/>
                                         
                                         
						<p:commandButton value="Retour à la connexion"
                                           action="#{forgotPasswordBean.goToLogin}"
                                           immediate="true"
               								process="@this"
                                           style="color:#0c5232;font-weight:bold;" />                                         

                    </p:panel>

                    <!-- STEP 2 : OTP -->
                    <p:panel rendered="#{forgotPasswordBean.step eq 2}"
                             header="Validation OTP">

                        <h:outputText
                                value="Un code OTP a été envoyé à votre adresse email." />

                        <br/><br/>

                        <p:outputLabel value="Code OTP"/>

                        <p:inputText id="otp"
                                     value="#{forgotPasswordBean.otp}"
                                     maxlength="6"
                                     required="true"
                                     style="width:100%"/>

                        <br/><br/>

                        <p:commandButton value="Valider OTP"
                                         action="#{forgotPasswordBean.validateOtp}"
                                         update="forgotForm"/>

                        <p:commandButton value="Retour"
                                         action="#{forgotPasswordBean.stepBack}"
                                         update="forgotForm"
                                         immediate="true"
                                         styleClass="ui-button-secondary"/>

                    </p:panel>

                    <!-- STEP 3 : RESET PASSWORD -->
                    <p:panel rendered="#{forgotPasswordBean.step eq 3}"
                             header="Nouveau mot de passe">

                        <p:outputLabel value="Nouveau mot de passe"/>

                        <p:password id="newPwd"
                                    value="#{forgotPasswordBean.newPassword}"
                                    feedback="true"
                                    required="true"
                                    style="width:100%"/>

                        <br/><br/>

                        <p:outputLabel value="Confirmation"/>

                        <p:password id="confirmPwd"
                                    value="#{forgotPasswordBean.confirmPassword}"
                                    required="true"
                                    style="width:100%"/>

                        <br/><br/>

                        <p:commandButton value="Modifier mot de passe"
                                         action="#{forgotPasswordBean.changePassword}"
                                         update="forgotForm"/>

                        <p:commandButton value="Retour à la connexion"
						                 action="#{forgotPasswordBean.goToLogin}"
						                 immediate="true"
						                 process="@this"
						                 ajax="false"
						                 styleClass="ui-button-secondary"/>

                    </p:panel>

                </h:form>
                
               </div>

            </div>
        </div>

    </section>

</div>

</h:body>
</html>
