<ui:composition template="/sec/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core">
                     
                                        

    <ui:define name="body">
    
       <ul class="breadcrumb br_styled no_space">                              
                <li class="active">Annulation package BNA</li>
              </ul> 
              <ul class="page_info">
             

			<h:form id="formAnnulation" >
					
					<h:panelGrid id="panelAnnulation" columns="3" columnClasses="labelWidth, ui-grid-col-3">
 						
 						
							<p:outputLabel value="Numéro Police:" for="txtpolice" />
							<p:inputText id="txtpolice"   styleClass="form-control taillem" value="#{packAnnulationBean.numPolice}" 
							onkeypress="if( (event.which &lt; 48 || event.which &gt; 57) ) return false;" required="true" requiredMessage="Il faut saisir le numéro de police"  >
							 </p:inputText>
                                                       
			 		</h:panelGrid>
			 		<p:messages autoUpdate="true" id="msgs"/>
			 		<p:outputLabel value="Les numéros de police du pack :"  />
			 		<h:panelGrid id="panelPolice" columns="2">
			 				<c:forEach items="#{packAnnulationBean.packPoliceDTO.list}" var="p">
			 					<h:outputLabel value="#{p.packPolicePK}" />
			 				</c:forEach>
			 				</h:panelGrid>
			 				
			 	  <p:commandButton id="viewButton"   icon="ui-icon-search" value="Chercher" update="formAnnulation" action="#{packAnnulationBean.chercher()}"  />    
			 	  <p:commandButton value="Confirmer" action="#{packAnnulationBean.annuler()}" rendered="#{packAnnulationBean.confirmation}">
			 	  
			 	  
			 	 </p:commandButton>
			</h:form>
              </ul>
    </ui:define>
</ui:composition>
