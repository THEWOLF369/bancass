<ui:composition template="/sec/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core">

    <ui:define name="body">
     <h:body style=" border: none;" rendered="#{!gestionProfil.ajoutSociete}" >
    <ul class="breadcrumb br_styled no_space">
            <li class="active">Accès non autorisé</li>
        </ul>
        <ul class="page_info">
         <center>
         <img src="../images/autorisation.jpg"  height="15%" width="15%"/>
         </center>
    </ul>
    </h:body>
    
   <h:body style=" border: none;" rendered="#{gestionProfil.ajoutSociete}" >
    
        <ul class="breadcrumb br_styled no_space">
            <li class="active">Gestion des Societes</li>
        </ul>
        <ul class="page_info">
       
      
            <h:form id="SocieteListForm">
                <p:panel header="Liste des Societes">
                    <p:dataTable id="datalist" value="#{societeBean.items}" var="item"
                                 selectionMode="single" selection="#{societeBean.selected}"
                                 paginator="true"
                                 rowKey="#{item.codSociet}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50">

                        <p:ajax event="rowSelect" update="createButton viewButton editButton deleteButton" />
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>

                        <p:column filterBy="#{item.codSociet}" filterStyle="width: 50px">
                            <f:facet name="header">
                                <h:outputText value="Code Societe"/>
                            </f:facet>
                            <h:outputText value="#{item.codSociet}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Raison Social"/>
                            </f:facet>
                            <h:outputText value="#{item.raisonSoc}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Matricule Fiscal"/>
                            </f:facet>
                            <h:outputText value="#{item.matfisc}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Adresse"/>
                            </f:facet>
                            <h:outputText value="#{item.codPost}, #{item.adresse}"/>
                        </p:column>
                         <p:column >
                            <f:facet name="header">
                                <h:outputText value="Logo"/>
                            </f:facet>
                            <center>
                            <img src="../images/#{item.codSociet}.png"  height="90px" width="90px"  align="center"/>
                            </center>
                        </p:column>
                        
                       

                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="Ajouter" actionListener="#{societeBean.prepareCreate}" update=":SocieteCreateForm" oncomplete="PF('SocieteCreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="Voir" update=":SocieteViewForm" oncomplete="PF('SocieteViewDialog').show()" disabled="#{empty societeBean.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="Modifier" update=":SocieteEditForm" oncomplete="PF('SocieteEditDialog').show()" disabled="#{empty societeBean.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="Supprimer" actionListener="#{societeBean.destroy}" update=":growl,datalist" disabled="#{empty societeBean.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>
            </h:form>

            <!-- Create Form -->

            <p:dialog id="SocieteCreateDlg" widgetVar="SocieteCreateDialog" modal="true" resizable="false" appendTo="@(body)" header="Ajouter une societe">
                <h:form id="SocieteCreateForm">
                    <h:panelGroup id="display">
                        <p:panelGrid columns="2">
                            <p:outputLabel value="Code Societe:" for="codSociet" />
                            <p:inputText id="codSociet" value="#{societeBean.selected.codSociet}" title="Code Societe" required="true" requiredMessage="Le Code Societe est obligatoire"/>
                            <p:outputLabel value="Raison sociale:" for="raisonSoc" />
                            <p:inputText id="raisonSoc" value="#{societeBean.selected.raisonSoc}" title="Raison sociale" />
                            <p:outputLabel value="Matricule Fiscal:" for="matfisc" />
                            <p:inputText id="matfisc" value="#{societeBean.selected.matfisc}" title="Matricule Fiscal" />
                            <p:outputLabel value="Adresse:" for="adresse" />
                            <p:inputText id="adresse" value="#{societeBean.selected.adresse}" title="adresse" />
                            <p:outputLabel value="Code Postal:" for="codPost" />
                            <p:inputText id="codPost" value="#{societeBean.selected.codPost}" title="Code Postal" />
                            <p:outputLabel value="Telphone:" for="telphone" />
                            <p:inputText id="telphone" value="#{societeBean.selected.telphone}" title="telphone" />
                            <p:outputLabel value="Fax:" for="fax" />
                            <p:inputText id="fax" value="#{societeBean.selected.fax}" title="fax" />
                            <p:outputLabel value="Telex:" for="telex" />
                            <p:inputText id="telex" value="#{societeBean.selected.telex}" title="telex" />
                            <p:outputLabel value="Nom du responsable:" for="nomResp" />
                            <p:inputText id="nomResp" value="#{societeBean.selected.nomResp}" title="Nom du responsable" />
                            <p:outputLabel value="Type du client:" for="typClient" />
                            <p:inputText id="typClient" value="#{societeBean.selected.typClient}" title="Type du client" />
                        </p:panelGrid>
                        <p:commandButton actionListener="#{societeBean.createNewSociete()}" value="Ajouter" update="display,:SocieteListForm:datalist,:growl" oncomplete="handleSubmit(args,'SocieteCreateDialog');"/>
                        <p:commandButton value="Annuler" onclick="SocieteCreateDialog.hide()"/>
                    </h:panelGroup>
                </h:form>
            </p:dialog>

            <!-- Edit Form --> 

            <p:dialog id="SocieteEditDlg" widgetVar="SocieteEditDialog" modal="true" resizable="false" appendTo="@(body)" header="Modifier une societe">
           
                <h:form id="SocieteEditForm">
                 <center>
                  <img src="../images/#{societeBean.selected.codSociet}.png"  height="120px" width="120px"  align="center"/>
               </center>
                    <h:panelGroup id="display">
                        <p:panelGrid columns="2" rendered="#{societeBean.selected != null}">
                            <p:outputLabel value="Code Societe:" for="codSociet" />
                            <p:inputText id="codSociet" value="#{societeBean.selected.codSociet}" title="Code Societe" required="true" requiredMessage="Le Code Societe est obligatoire"/>
                            <p:outputLabel value="Raison sociale:" for="raisonSoc" />
                            <p:inputText id="raisonSoc" value="#{societeBean.selected.raisonSoc}" title="Raison sociale" />
                            <p:outputLabel value="Matricule Fiscal:" for="matfisc" />
                            <p:inputText id="matfisc" value="#{societeBean.selected.matfisc}" title="Matricule Fiscal" />
                            <p:outputLabel value="Adresse:" for="adresse" />
                            <p:inputText id="adresse" value="#{societeBean.selected.adresse}" title="adresse" />
                            <p:outputLabel value="Code Postal:" for="codPost" />
                            <p:inputText id="codPost" value="#{societeBean.selected.codPost}" title="Code Postal" />
                            <p:outputLabel value="Telphone:" for="telphone" />
                            <p:inputText id="telphone" value="#{societeBean.selected.telphone}" title="telphone" />
                            <p:outputLabel value="Fax:" for="fax" />
                            <p:inputText id="fax" value="#{societeBean.selected.fax}" title="fax" />
                            <p:outputLabel value="Telex:" for="telex" />
                            <p:inputText id="telex" value="#{societeBean.selected.telex}" title="telex" />
                            <p:outputLabel value="Nom du responsable:" for="nomResp" />
                            <p:inputText id="nomResp" value="#{societeBean.selected.nomResp}" title="Nom du responsable" />
                            <p:outputLabel value="Type du client:" for="typClient" />
                            <p:inputText id="typClient" value="#{societeBean.selected.typClient}" title="Type du client" />
                        </p:panelGrid>
                        <p:commandButton actionListener="#{societeBean.updateSociete()}" value="Modifier" update="display,:SocieteListForm:datalist,:growl" oncomplete="handleSubmit(args, 'SocieteEditDialog');"/>
                        <p:commandButton value="Annuler" onclick="SocieteEditDialog.hide()"/>
                    </h:panelGroup>
                </h:form>
            </p:dialog>

            <!-- View Form --> 

            <p:dialog id="SocieteViewDlg" widgetVar="SocieteViewDialog" modal="true" resizable="false" appendTo="@(body)" header="Details Societe">
                <h:form id="SocieteViewForm">
                <center>
                  <img src="../images/#{societeBean.selected.codSociet}.png"  height="120px" width="120px"  align="center"/>
                  </center>
                    <h:panelGroup id="display">
                        <p:panelGrid columns="2" rendered="#{societeBean.selected != null}">
                            <p:panelGrid columns="2" rendered="#{societeBean.selected != null}">
                                <h:outputText value="Code Societe:"/>
                                <h:outputText value="#{societeBean.selected.codSociet}" title="Code Societe"/>
                                <h:outputText value="Raison sociale:"/>
                                <h:outputText value="#{societeBean.selected.raisonSoc}" title="Raison sociale"/>
                                <h:outputText value="Matricule Fiscal:"/>
                                <h:outputText value="#{societeBean.selected.matfisc}" title="Matricule Fiscal"/>
                                <h:outputText value="Adresse:"/>
                                <h:outputText value="#{societeBean.selected.adresse}" title="Adresse:"/>
                                <h:outputText value="Code Postal:"/>
                                <h:outputText value="#{societeBean.selected.codPost}" title="Code Postal"/>
                                <h:outputText value="Telphone:"/>
                                <h:outputText value="#{societeBean.selected.telphone}" title="Telphone:"/>
                                <h:outputText value="Fax:"/>
                                <h:outputText value="#{societeBean.selected.fax}" title="Fax:"/>
                                <h:outputText value="Telex:"/>
                                <h:outputText value="#{societeBean.selected.telex}" title="Telex:"/>
                                <h:outputText value="Nom du responsable:"/>
                                <h:outputText value="#{societeBean.selected.nomResp}" title="Nom du responsable"/>
                                <h:outputText value="Type du client:"/>
                                <h:outputText value="#{societeBean.selected.typClient}" title="Type du client"/>
                            </p:panelGrid>
                        </p:panelGrid>
                        <p:commandButton value="Fermer" onclick="SocieteViewDialog.hide()"/>
                    </h:panelGroup>
                </h:form>
            </p:dialog>
         
             
       
        </ul>
</h:body>
        <script>
            function handleSubmit(args, dialog) {
                var jqDialog = jQuery('#' + dialog);
                if (args.validationFailed) {
                    jqDialog.effect('shake', {times: 3}, 100);
                } else {
                    PF(dialog).hide();
                }
            }
        </script>
    </ui:define>

    <ui:define name="jquery"></ui:define>
    <ui:define name="jqueryui"></ui:define>
</ui:composition>
