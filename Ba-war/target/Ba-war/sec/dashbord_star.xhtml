<ui:composition template="/sec/template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="body">

		<ul class="breadcrumb br_styled no_space">
			<li class="active">Dashboard</li>
		</ul>
		<ul class="page_info">


			<h:form id="form">
				<p:growl id="growl" showDetail="true" />

				<h:panelGrid columns="3" cellpadding="3" style="width:50%"
					rendered="#{login.utilisateur.profil.code.equals('AST')||login.utilisateur.profil.code.equals('IST')||
    login.utilisateur.profil.code.equals('TDST')||login.utilisateur.profil.code.equals('VST')||
    login.utilisateur.profil.code.equals('ASI')||login.utilisateur.profil.code.equals('MHST')||
    login.utilisateur.profil.code.equals('VTST')}">

					<p:outputLabel for="numsoc" value="Société:" />
					<p:selectOneMenu id="numsoc" styleClass="form-control"
						value="#{chartView.codeSociete}" filter="true"
						filterMatchMode="contains" style="width:60px">
						<p:ajax listener="#{chartView.Bothchart}"
							update="dataPanelpie,numag,dataPanel,export" />
						<f:selectItems value="#{chartView.listSociete}" />

					</p:selectOneMenu>


				</h:panelGrid>

				<br />
				<br />

				<h:panelGrid columns="2" columnClasses="left,right">

					<p:panel id="dataPanelpie">

						<p:chart type="pie" model="#{chartView.pieModel1}"
							style="width:700px;height:400px" styleClass="medium-Pie">

						</p:chart>
					</p:panel>



				</h:panelGrid>


				<br />
				<br />



				<h:panelGrid columns="8" cellpadding="8">


					<p:outputLabel for="date" value="mois/année:" />


					<p:inputText size="20" id="date" value="#{chartView.month_year}"
						style="width: 70px !important;">

						<p:ajax listener="#{chartView.createBarModels}"
							update="dataPanel,export" />
					</p:inputText>


					<script src="../js/jquery-ui.min.js"></script>
					<script src="../js/jquery.mtz.monthpicker.js"></script>
					<script>
$('#form\\:date').monthpicker();
</script>



					<p:outputLabel for="numag" value="Agence:"
						rendered="#{login.utilisateur.profil.code.equals('AST')||login.utilisateur.profil.code.equals('IST')||
    login.utilisateur.profil.code.equals('TDST')||login.utilisateur.profil.code.equals('VST')||
    login.utilisateur.profil.code.equals('ASI')||login.utilisateur.profil.code.equals('MHST')||
    login.utilisateur.profil.code.equals('VTST')}" />
					<p:selectOneMenu style="width:195px;" id="numag"
						rendered="#{login.utilisateur.profil.code.equals('AST')||login.utilisateur.profil.code.equals('IST')||
    login.utilisateur.profil.code.equals('TDST')||login.utilisateur.profil.code.equals('VST')||
    login.utilisateur.profil.code.equals('ASI')||login.utilisateur.profil.code.equals('MHST')||
    login.utilisateur.profil.code.equals('VTST')}"
						filter="true" filterMatchMode="contains"
						value="#{chartView.codeAgence}" disabled="#{chartView.vrais}">

						<f:selectItems value="#{chartView.listAgence}" />
						<p:ajax listener="#{chartView.createBarModels}"
							update="dataPanel,export" />
					</p:selectOneMenu>




					<p:outputLabel for="numpol" value="Agence:"
						rendered="#{login.utilisateur.profil.code.equals('AS')}" />
					<p:selectOneMenu id="numpol" styleClass="form-control"
						value="#{chartView.codeAgence}" filter="true"
						filterMatchMode="contains"
						rendered="#{login.utilisateur.profil.code.equals('AS')}"
						disabled="#{chartView.vrais}">
						<f:selectItems value="#{chartView.listAgence}" />
						<p:ajax listener="#{chartView.createBarModels}"
							update="dataPanel,export" />
					</p:selectOneMenu>


					<h:panelGrid columns="2" style="margin-bottom:10px" cellpadding="5"
						rendered="#{login.utilisateur.profil.code.equals('AS')||login.utilisateur.profil.code.equals('AST')||login.utilisateur.profil.code.equals('IST')||
    login.utilisateur.profil.code.equals('TDST')||login.utilisateur.profil.code.equals('VST')||
    login.utilisateur.profil.code.equals('ASI')}">
						<h:outputText value="Toutes les agences" />
						<p:selectBooleanCheckbox value="#{chartView.vrais}" id="chbox">
							<p:ajax update="dataPanel,numag,numpol,export"
								listener="#{chartView.createBarModels}" />
						</p:selectBooleanCheckbox>
					</h:panelGrid>



				</h:panelGrid>


				<p:panel id="dataPanel">


					<h:panelGrid columns="1">

						<p:fieldset>
							<p:chart type="bar" model="#{chartView.barModel}"
								style="height:500px">

							</p:chart>
						</p:fieldset>

						<p:fieldset>
							<p:chart type="bar" model="#{chartView.barSommeModel}"
								style="height:500px">

							</p:chart>
						</p:fieldset>
					</h:panelGrid>

				</p:panel>
				<br/>
				<br/>
				<br/>
				<p:panel id="export"
					rendered="#{login.utilisateur.profil.code.equals('AS')||login.utilisateur.profil.code.equals('AST')||login.utilisateur.profil.code.equals('IST')||
    login.utilisateur.profil.code.equals('TDST')||login.utilisateur.profil.code.equals('VST')||
    login.utilisateur.profil.code.equals('ASI')||login.utilisateur.profil.code.equals('MHST')||
    login.utilisateur.profil.code.equals('VTST')}">

					<p:dataTable id="tbl" var="car" value="#{chartView.agenceProduits}"
						paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {Exporters}"
						paginator="true" rows="10" style="margin-bottom:20px">


						<f:facet name="{Exporters}">
							<h:commandLink>
								<p:graphicImage value="../images/excel.png" width="24" />
								<p:dataExporter type="xls" target="tbl" fileName="statistiques" />
							</h:commandLink>

							<h:commandLink>
								<p:graphicImage value="../images/pdf.png" width="24" />
								<p:dataExporter type="pdf" target="tbl" fileName="statistiques" />
							</h:commandLink>

							<h:commandLink>
								<p:graphicImage value="../images/csv.png" width="24" />
								<p:dataExporter type="csv" target="tbl" fileName="statistiques" />
							</h:commandLink>


						</f:facet>





						<p:column>
							<f:facet name="header">
								<h:outputText value="Code Agence" />
							</f:facet>
							<h:outputText value="#{car.codeagence}" />
						</p:column>

						<p:column>
							<f:facet name="header">
								<h:outputText value="Agence" />
							</f:facet>
							<h:outputText value="#{car.libelle}" />
						</p:column>

						<p:column>
							<f:facet name="header">
								<h:outputText value="Produit" />
							</f:facet>
							<h:outputText value="#{car.produit}" />
						</p:column>

						<p:column>
							<f:facet name="header">
								<h:outputText value="Semaine" />
							</f:facet>
							<h:outputText value="#{car.semaine}" />
						</p:column>

						<p:column>
							<f:facet name="header">
								<h:outputText value="nb Adhesion" />
							</f:facet>
							<h:outputText value="#{car.nombre}" />
						</p:column>





						<p:column>
							<f:facet name="header">
								<h:outputText value="Chiffre d'affaires" />
							</f:facet>
							<h:outputText
								value="#{car.idproduit == 3 || car.idproduit == 1 ? car.mtprime : car.primetot}" />
						</p:column>

					</p:dataTable>

				</p:panel>

				<br />
				<br />

				<!-- celui de la nouvelle recherche  par periode (demande de la STB)-->

				<h:panelGrid columns="10" cellpadding="1" rendered="#{login.utilisateur.profil.code.equals('AS')||login.utilisateur.profil.code.equals('AST')||login.utilisateur.profil.code.equals('IST')||
    login.utilisateur.profil.code.equals('TDST')||login.utilisateur.profil.code.equals('VST')||
    login.utilisateur.profil.code.equals('ASI')||login.utilisateur.profil.code.equals('MHST')||
    login.utilisateur.profil.code.equals('VTST')}">

					<p:outputLabel for="id_date1" value="Du:" />

					<p:calendar id="id_date1" value="#{chartView.date1}"
						styleClass="combo-style" showButtonPanel="true"
						pattern="dd/MM/yyyy" navigator="true" required="true"
						requiredMessage="La date début est obligatoire">
						<p:ajax event="dateSelect" update="id_date2" />
					</p:calendar>
					<p:message for="id_date1" />

					<p:outputLabel for="id_date2" value="Au:" />

					<p:calendar id="id_date2" value="#{chartView.date2}"
						styleClass="combo-style" mindate="#{chartView.date1}"
						showButtonPanel="true" pattern="dd/MM/yyyy" navigator="true"
						required="true" requiredMessage="La date fin est obligatoire">

					</p:calendar>
					<p:message for="id_date2" />
					
					<!-- <p:outputLabel for="etat" value="Etat:" />
					<h:selectOneMenu value="#{chartView.etat}" id="etat"
						style="width:120px;">
						<f:selectItem itemValue="V" itemLabel="en vigueur" />
						<f:selectItem itemValue="A" itemLabel="annulé" />
					</h:selectOneMenu>-->

					<p:commandLink action="#{chartView.importData()}"
						update="export_stat,tbl_stat" ajax="true" id="ok_stat">
						<img src="../img/search.jpg" width="32" height="32" />
					</p:commandLink>

				</h:panelGrid>

				<p:panel id="export_stat"
					rendered="#{login.utilisateur.profil.code.equals('AS')||login.utilisateur.profil.code.equals('AST')||login.utilisateur.profil.code.equals('IST')||
    login.utilisateur.profil.code.equals('TDST')||login.utilisateur.profil.code.equals('VST')||
    login.utilisateur.profil.code.equals('ASI')||login.utilisateur.profil.code.equals('MHST')||
    login.utilisateur.profil.code.equals('VTST')}">

					<p:dataTable id="tbl_stat" var="stat"
						value="#{chartView.importDatas}"
						paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {Exporters}"
						paginator="true" rows="10" style="margin-bottom:20px">


						<f:facet name="{Exporters}">
							<h:commandLink>
								<p:graphicImage value="../images/excel.png" width="24" />
								<p:dataExporter type="xls" target="tbl_stat"
									fileName="statistiques" />
							</h:commandLink>

							<h:commandLink>
								<p:graphicImage value="../images/pdf.png" width="24" />
								<p:dataExporter type="pdf" target="tbl_stat"
									fileName="statistiques" />
							</h:commandLink>

							<h:commandLink>
								<p:graphicImage value="../images/csv.png" width="24" />
								<p:dataExporter type="csv" target="tbl_stat"
									fileName="statistiques" />
							</h:commandLink>


						</f:facet>


						<p:column>
							<f:facet name="header">
								<h:outputText value="Code Agence" />
							</f:facet>
							<h:outputText value="#{stat.codeagence}" />
						</p:column>


						<p:column>
							<f:facet name="header">
								<h:outputText value="N° compte" />
							</f:facet>
							<h:outputText value="#{stat.ncompte}" />
						</p:column>

						<p:column>
							<f:facet name="header">
								<h:outputText value="Produit" />
							</f:facet>
							<h:outputText value="#{stat.contrat}" />
						</p:column>
<!-- 
						<p:column visible="false">
							<f:facet name="header">
								<h:outputText value="Nom" />
							</f:facet>
							<h:outputText value="#{stat.nom_client}" />
						</p:column>

						<p:column visible="false">
							<f:facet name="header">
								<h:outputText value="Prenom" />
							</f:facet>
							<h:outputText value="#{stat.prenom_client}" />
						</p:column>
 -->
						<p:column>
							<f:facet name="header">
								<h:outputText value="Adhesion" />
							</f:facet>
							<h:outputText value="#{stat.adhesion}" />
						</p:column>

						<p:column>
							<f:facet name="header">
								<h:outputText value="Date debut" > 
								</h:outputText>
							</f:facet>
							<h:outputText value="#{stat.debut}" />
						</p:column>

						<p:column visible="false">
							<f:facet name="header">
								<h:outputText value="Date fin" />
							</f:facet>
							<h:outputText value="#{stat.fin}" />
						</p:column>
						
							<p:column>
							<f:facet name="header">
								<h:outputText value="Date création" > 
								</h:outputText>
							</f:facet>
							<h:outputText value="#{stat.date_create}" />
						</p:column>
						
						<p:column>
							<f:facet name="header">
								<h:outputText value="Type assistance" > 
								</h:outputText>
							</f:facet>
							<h:outputText value="#{stat.type_assist}" />
						</p:column>
						

						<p:column style="width:40px;">
							<f:facet name="header">
								<h:outputText value="Duree" />
							</f:facet>
							<h:outputText value="#{stat.duree}" />
						</p:column>

					<!-- 	<p:column visible="false">-->
					 <p:column>
							<f:facet name="header">
								<h:outputText value="Etat" />
							</f:facet>
							<h:outputText value="#{stat.etat}" />
						</p:column>

						<p:column rendered="#{chartView.etat.equals('A')}">
							<f:facet name="header">
								<h:outputText value="Date annulation" />
							</f:facet>
							<h:outputText value="#{stat.annulation}" />
						</p:column>

						<p:column>
							<f:facet name="header">
								<h:outputText value="Prime" />
							</f:facet>
							<h:outputText value="#{stat.mtprime}">
								<f:convertNumber pattern="#0.000" />
							</h:outputText>
						</p:column>

						
						<!-- <p:column>
							<f:facet name="header">
								<h:outputText value="commision" />
							</f:facet>
							<h:outputText value="#{stat.commision}">
								<f:convertNumber pattern="#0.000" />
							</h:outputText>
						</p:column>-->
						
						<p:column>
							<f:facet name="header">
								<h:outputText value="Commission" />
							</f:facet>
							<h:outputText value="#{stat.commission}">
								<f:convertNumber pattern="#0.000" />
							</h:outputText>
						</p:column>



					</p:dataTable>


				</p:panel>



				<p:blockUI block="tbl" trigger="tbl">
        Chargement<br />
					<p:graphicImage value="../img/loaders/page_loader.gif" />
				</p:blockUI>


				<p:blockUI block="form" trigger="date">
        Chargement<br />
					<p:graphicImage value="../img/loaders/page_loader.gif" />
				</p:blockUI>

				<p:blockUI block="form" trigger="chbox">
        Chargement<br />
					<p:graphicImage value="../img/loaders/page_loader.gif" />
				</p:blockUI>

				<p:blockUI block="form" trigger="numsoc">
        Chargement<br />
					<p:graphicImage value="../img/loaders/page_loader.gif" />
				</p:blockUI>


				<p:blockUI block="form" trigger="numag,numpol">
        Chargement<br />
					<p:graphicImage value="../img/loaders/page_loader.gif" />
				</p:blockUI>


			</h:form>



		</ul>
	</ui:define>
</ui:composition>
