        <script>
            function filterTable(input, className) {
                console.log(input);
                filterInput = $("." + className);
                filterInput.val(input.value);
                filterInput.trigger("keyup");
            }

            function filterTableDate(className) {
                dateValue = PF('filterDate').input.val();
                filterInput = $("." + className);
                filterInput.val(dateValue);
                filterInput.trigger("keyup");
            }

            function filtrerGlobal() {
                filterEtat('etatFilter', document.getElementById('form:idSelectionEtat'));
                
            }
           
            
            function filterEtat(className, etat) {
                filterInput = $("." + className);
                etat = etat.options[etat.selectedIndex].value;
                if (etat === 'a') {
                    etat = "";
                }
                filterInput.val(etat);
                filterInput.trigger("keyup");
            }
