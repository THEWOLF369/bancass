<ui:composition 
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		<ul class="page_info" style="padding-top: 40px">
						
			<h:panelGroup id="panelTD">

					<p:messages id="messagesTD" showDetail="false" autoUpdate="true" closable="true" />

						<h:panelGrid columns="3" columnClasses="labelWidth, ui-grid-col-3">
							<label class="bold">Police : </label>
							<h:selectOneMenu id="numpol" styleClass="form-control"	value="#{packBean.numplc}"
							disabled="#{packBean.selectedProposition.notifie}">
								<f:selectItems value="#{packBean.listnumplc}" />
								<p:ajax event="mouseup" 	listener="#{packBean.calc_date()}" />
								<p:ajax event="change" update="tauxdeprime"	listener="#{packBean.tauxdeprime()}" />
								
							</h:selectOneMenu>
							<p:message for="numpol" />
							
							  <h:panelGroup  rendered="!#{!login.utilisateur.profil.code.equals('BNAA') || !login.utilisateur.profil.code.equals('BNA')}">

							<label class="bold"> Taux de Prime :</label>
							<h:inputText id="tauxdeprime" styleClass="form-control"
								value="#{packBean.tauxdeprime}" disabled="true">
								<f:convertNumber pattern="#0.000" />
							</h:inputText>
							<p:message for="tauxdeprime" />
                             </h:panelGroup>

							</h:panelGrid>


						



				</h:panelGroup>			
						
						
		</ul>
		
   
</ui:composition>
